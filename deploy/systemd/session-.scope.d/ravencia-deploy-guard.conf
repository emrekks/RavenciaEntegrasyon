# Installed as /etc/systemd/system/session-.scope.d/ravencia-deploy-guard.conf
# (a prefix drop-in for every login session scope, session-<n>.scope).
# A CI deploy runs inside the deploy key's SSH session scope. Ordering the scopes
# after ravencia-deploy-guard.service means that at shutdown systemd stops them
# only after the guard's ExecStop has waited for the deploy lock, instead of
# killing the deploy at once. Check on the host: systemctl show -p After session-<n>.scope
[Unit]
After=ravencia-deploy-guard.service
