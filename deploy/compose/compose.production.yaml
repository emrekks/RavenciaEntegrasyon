# Production logging: journald instead of json-file. Every deploy re-creates the
# containers, which deleted their json-file logs; journald keeps them across
# releases. Read with e.g.
#   journalctl CONTAINER_NAME=marketplacehub-api-1 --since -1h
#   journalctl CONTAINER_NAME=marketplacehub-worker-1 -f
# Retention follows the host journald limits (docs/CI-CD-DEPLOY.md).
# `!override` replaces the base json-file block (its max-size/max-file options
# are invalid for journald) instead of merging into it.
services:
  postgres:
    logging: !override
      driver: journald
      options: { tag: "{{.Name}}" }
  migrate:
    image: ${MARKETPLACEHUB_APP_IMAGE:?set immutable application image with digest}
    build: null
    environment: &production_environment
      MARKETPLACEHUB_ENVIRONMENT: PRODUCTION
      AllowedHosts: ${MARKETPLACEHUB_ALLOWED_HOSTS:?set production allowed hosts}
      Marketplace__PublicBaseUrl: ${MARKETPLACEHUB_SITE_ADDRESS:?set production https address}
      Hepsiburada__AuthenticationMode: BASIC
      Hepsiburada__ProductionCatalogBaseAddress: ${HEPSIBURADA_PRODUCTION_CATALOG_BASE_ADDRESS:-https://mpop.hepsiburada.com/product/}
      FeatureFlags__ExternalWrites: "${MARKETPLACEHUB_EXTERNAL_WRITES_ENABLED:-true}"
      FeatureFlags__InvoiceMarketplaceDeliveryWrites: "${MARKETPLACEHUB_INVOICE_MARKETPLACE_DELIVERY_WRITES_ENABLED:-true}"
      Marketplace__PersistOrderSnapshots: "true"
      DataProtection__CertificatePath: /run/secrets/dp_certificate
      DataProtection__CertificatePassword_FILE: /run/secrets/dp_certificate_password
    secrets: &production_secrets [app_db_connection, credential_key, dp_certificate, dp_certificate_password]
    logging: !override
      driver: journald
      options: { tag: "{{.Name}}" }
  api:
    image: ${MARKETPLACEHUB_APP_IMAGE:?set immutable application image with digest}
    build: null
    environment: *production_environment
    secrets: *production_secrets
    logging: !override
      driver: journald
      options: { tag: "{{.Name}}" }
  worker:
    image: ${MARKETPLACEHUB_APP_IMAGE:?set immutable application image with digest}
    build: null
    environment: *production_environment
    secrets: *production_secrets
    logging: !override
      driver: journald
      options: { tag: "{{.Name}}" }
  caddy:
    image: ${MARKETPLACEHUB_EDGE_IMAGE:?set immutable edge image with digest}
    build: null
    environment:
      MARKETPLACEHUB_SITE_ADDRESS: ${MARKETPLACEHUB_SITE_ADDRESS:?set production https address}
    logging: !override
      driver: journald
      options: { tag: "{{.Name}}" }

secrets:
  dp_certificate: { file: ../secrets/dp_certificate.pfx }
  dp_certificate_password: { file: ../secrets/dp_certificate_password.txt }
