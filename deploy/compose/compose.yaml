name: marketplacehub

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: marketplacehub-app:f1-local
  restart: unless-stopped
  init: true
  networks: [backend]
  # Hardening (security plan U3): no privilege gain through setuid binaries or file capabilities, no Linux
  # capabilities at all (the app runs as the image's non-root APP_UID 1654 and binds 8080), a read-only root
  # filesystem with only /tmp writable (worker heartbeat, .NET diagnostics socket) next to the two data
  # volumes, and a process cap (threads count too; a busy API or worker stays at a few hundred at most).
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  pids_limit: 1024
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    MARKETPLACEHUB_ENVIRONMENT: PILOT_LOCAL
    AllowedHosts: "${MARKETPLACEHUB_ALLOWED_HOSTS:-localhost;127.0.0.1}"
    Marketplace__PublicBaseUrl: "${MARKETPLACEHUB_SITE_ADDRESS:-}"
    ConnectionStrings__AppDb_FILE: /run/secrets/app_db_connection
    Security__CredentialKey_FILE: /run/secrets/credential_key
    Bootstrap__Enabled: "false"
    Bootstrap__TenantCode: ${MARKETPLACEHUB_BOOTSTRAP_TENANT_CODE:-ravencia}
    Bootstrap__TenantDisplayName: ${MARKETPLACEHUB_BOOTSTRAP_TENANT_NAME:-Ravencia}
    Bootstrap__OwnerEmail: ${MARKETPLACEHUB_BOOTSTRAP_OWNER_EMAIL:-owner@example.invalid}
    Bootstrap__OwnerDisplayName: ${MARKETPLACEHUB_BOOTSTRAP_OWNER_NAME:-Ravencia Admin}
    FeatureFlags__ExternalWrites: "false"
    TrendyolEFaturam__DocumentAllowedHosts__0: ${MARKETPLACEHUB_EFATURAM_DOCUMENT_HOST:-}
    TrendyolEFaturam__OutgoingInvoiceStatusPath: ${MARKETPLACEHUB_EFATURAM_EINVOICE_STATUS_PATH:-}
    Worker__HealthFile: /tmp/marketplacehub-worker-heartbeat
    Worker__HealthStaleAfterSeconds: "120"
    Storage__Root: /var/lib/marketplacehub/files
    DataProtection__KeysRoot: /var/lib/marketplacehub/dp-keys
  secrets:
    - app_db_connection
    - credential_key
  volumes:
    - app_files:/var/lib/marketplacehub/files
    - dp_keys:/var/lib/marketplacehub/dp-keys
  # Local default. Production switches to journald in compose.production.yaml.
  logging: &local_logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  deploy:
    resources:
      limits: { memory: 1536M, cpus: "2.00" }

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    init: true
    networks: [backend]
    environment:
      POSTGRES_DB: marketplacehub
      POSTGRES_USER: marketplacehub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pg_data:/var/lib/postgresql]
    # Hardening (U3). The official entrypoint starts as root, fixes ownership and modes of the data and socket
    # directories (CHOWN, DAC_OVERRIDE, FOWNER) and then drops to the postgres user with gosu (SETUID, SETGID);
    # nothing else is kept. The root filesystem stays writable: PostgreSQL keeps its socket and lock files there.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # One process per connection (max_connections 150) plus background and parallel workers.
    pids_limit: 512
    # Pools: API 25 (app_db_connection.txt), Worker 45 (Database:MaxPoolSize in its
    # appsettings.json overrides the file), each shared rate limiter 5. About 82 in
    # total, so 150 leaves room for LISTEN, migrate, backup and psql sessions.
    # Sized for the 16 GiB host (Hostinger KVM 4, since 3 Nov 2026): a 6 GiB container limit with 1.5 GiB of
    # shared_buffers leaves room for query memory (on the 8 GiB host a 1 GiB limit got PostgreSQL killed by the
    # out-of-memory killer four times on 20 Oct 2026); effective_cache_size counts the host page cache the database
    # fits in. Statements slower than 2 s are logged.
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - log_min_duration_statement=2000
    # Docker's 64 MB /dev/shm breaks parallel hash/sort ("could not resize shared memory").
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplacehub -d marketplacehub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *local_logging
    deploy:
      resources:
        limits: { memory: 6144M, cpus: "3.00" }

  migrate:
    <<: *app
    restart: "no"
    command: ["api/MarketplaceHub.Api.dll", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["api/MarketplaceHub.Api.dll"]
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "dotnet", "api/MarketplaceHub.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: ["worker/MarketplaceHub.Worker.dll"]
    # Give the worker time to hand running jobs back to the queue before SIGKILL.
    stop_grace_period: 45s
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/marketplacehub-worker-heartbeat && find /tmp/marketplacehub-worker-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s

  # One-shot before every edge start: hands the certificate and config volumes to the non-root edge user.
  # Volumes written while Caddy still ran as root hold root-owned 0600 files; this makes them Caddy's again
  # and changes nothing afterwards. Root with only the capabilities a recursive chown needs, no network.
  caddy-volumes:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    image: marketplacehub-edge:f1-local
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["chown", "-R", "10080:10080", "/data", "/config"]
    volumes: [caddy_data:/data, caddy_config:/config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER]
    pids_limit: 32
    logging: *local_logging

  caddy:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    image: marketplacehub-edge:f1-local
    restart: unless-stopped
    init: true
    networks: [edge, backend]
    # Hardening (U3): Caddy runs as uid 10080 instead of the image's root, without any Linux capability. Ports
    # 80 and 443 need no NET_BIND_SERVICE: in the container's own network namespace every user may bind from
    # port 0 (ip_unprivileged_port_start, Docker's default since 20.10, set here explicitly). An added
    # NET_BIND_SERVICE would not reach a non-root process anyway: no-new-privileges keeps file capabilities
    # out. Certificates and the autosaved config live in /data and /config (handed over by caddy-volumes);
    # everything else is read-only.
    user: "10080:10080"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    sysctls: { net.ipv4.ip_unprivileged_port_start: "0" }
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 256
    # IPv6 visitors (G3, see ClientNetwork.cs and docs/CI-CD-DEPLOY.md "Kenar"): the edge network is IPv4 only,
    # so a connection that reaches the host over IPv6 is accepted by Docker's userland proxy (docker-proxy) and
    # arrives here from the bridge gateway's private IPv4 address. Every IPv6 visitor then looks like one private
    # sender: rate limits and sign-in throttles are shared, and "remote_ip private_ranges" opens /health/ready and
    # /health/queues to them. On a host with an AAAA record, enable IPv6 for this network (daemon.json "ipv6": true
    # and "ip6tables": true, plus enable_ipv6 on the network). Setting "userland-proxy": false instead stops the
    # proxying, but then IPv6 connections are not forwarded at all and the AAAA record should go. Either way, check
    # that Caddy's access log shows the client's own remote_ip for a request made over IPv6.
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { MARKETPLACEHUB_SITE_ADDRESS: "${MARKETPLACEHUB_SITE_ADDRESS:-https://localhost}" }
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      caddy-volumes: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *local_logging
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  backup:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: ["operations"]
    restart: "no"
    networks: [backend]
    environment:
      PGHOST: postgres
      PGDATABASE: marketplacehub
      PGUSER: marketplacehub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    # Hardening (U3): runs as root (it writes the root-owned staging volume) and may only read past file modes,
    # which the API's private files and Data Protection keys (uid 1654) need.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    pids_limit: 128
    volumes:
      - backup_staging:/backup
      - ../backup/backup.sh:/opt/marketplacehub/backup.sh:ro
      - app_files:/source/files:ro
      - dp_keys:/source/dp-keys:ro
    entrypoint: ["/bin/sh", "/opt/marketplacehub/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  validation-postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: ["validation"]
    restart: "no"
    networks: [validation]
    environment:
      POSTGRES_DB: marketplacehub_test
      POSTGRES_USER: marketplacehub
      POSTGRES_PASSWORD: validation-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplacehub -d marketplacehub_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  validation-tests:
    profiles: ["validation"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: validation
    image: marketplacehub-validation:local
    restart: "no"
    networks: [validation]
    environment:
      MARKETPLACEHUB_TEST_CONNECTION: "Host=validation-postgres;Port=5432;Database=marketplacehub_test;Username=marketplacehub;Password=validation-only"
      FeatureFlags__ExternalWrites: "false"
    depends_on:
      validation-postgres: { condition: service_healthy }

networks:
  edge: {}
  egress: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  validation:
    internal: true
volumes:
  pg_data: {}
  app_files: {}
  dp_keys: {}
  caddy_data: {}
  caddy_config: {}
  backup_staging: {}
secrets:
  postgres_password: { file: ../secrets/postgres_password.txt }
  app_db_connection: { file: ../secrets/app_db_connection.txt }
  credential_key: { file: ../secrets/credential_key.txt }
