name: marketplacehub

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: marketplacehub-app:f1-local
  restart: unless-stopped
  init: true
  networks: [backend]
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    MARKETPLACEHUB_ENVIRONMENT: PILOT_LOCAL
    AllowedHosts: "${MARKETPLACEHUB_ALLOWED_HOSTS:-localhost;127.0.0.1}"
    Marketplace__PublicBaseUrl: "${MARKETPLACEHUB_SITE_ADDRESS:-}"
    ConnectionStrings__AppDb_FILE: /run/secrets/app_db_connection
    Security__CredentialKey_FILE: /run/secrets/credential_key
    Bootstrap__Enabled: "false"
    Bootstrap__TenantCode: ${MARKETPLACEHUB_BOOTSTRAP_TENANT_CODE:-ravencia}
    Bootstrap__TenantDisplayName: ${MARKETPLACEHUB_BOOTSTRAP_TENANT_NAME:-Ravencia}
    Bootstrap__OwnerEmail: ${MARKETPLACEHUB_BOOTSTRAP_OWNER_EMAIL:-owner@example.invalid}
    Bootstrap__OwnerDisplayName: ${MARKETPLACEHUB_BOOTSTRAP_OWNER_NAME:-Ravencia Admin}
    FeatureFlags__ExternalWrites: "false"
    TrendyolEFaturam__DocumentAllowedHosts__0: ${MARKETPLACEHUB_EFATURAM_DOCUMENT_HOST:-}
    TrendyolEFaturam__OutgoingInvoiceStatusPath: ${MARKETPLACEHUB_EFATURAM_EINVOICE_STATUS_PATH:-}
    Worker__HealthFile: /tmp/marketplacehub-worker-heartbeat
    Worker__HealthStaleAfterSeconds: "120"
    Storage__Root: /var/lib/marketplacehub/files
    DataProtection__KeysRoot: /var/lib/marketplacehub/dp-keys
  secrets:
    - app_db_connection
    - credential_key
  volumes:
    - app_files:/var/lib/marketplacehub/files
    - dp_keys:/var/lib/marketplacehub/dp-keys
  # Local default. Production switches to journald in compose.production.yaml.
  logging: &local_logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  deploy:
    resources:
      limits: { memory: 768M, cpus: "1.50" }

services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    init: true
    networks: [backend]
    environment:
      POSTGRES_DB: marketplacehub
      POSTGRES_USER: marketplacehub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pg_data:/var/lib/postgresql]
    # API and Worker cap each Npgsql pool at 25 (app_db_connection.txt); 150 leaves
    # room for both services' pools, LISTEN, migrate, backup and psql sessions.
    # shared_buffers/effective_cache_size fit the 2 GiB container limit on an 8 GiB host (1 GiB left too little
    # room for query memory: PostgreSQL was killed by the out-of-memory killer four times on 20 Oct 2026);
    # statements slower than 2 s are logged.
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - log_min_duration_statement=2000
    # Docker's 64 MB /dev/shm breaks parallel hash/sort ("could not resize shared memory").
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplacehub -d marketplacehub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *local_logging
    deploy:
      resources:
        limits: { memory: 2048M, cpus: "1.50" }

  migrate:
    <<: *app
    restart: "no"
    command: ["api/MarketplaceHub.Api.dll", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["api/MarketplaceHub.Api.dll"]
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "dotnet", "api/MarketplaceHub.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: ["worker/MarketplaceHub.Worker.dll"]
    # Give the worker time to hand running jobs back to the queue before SIGKILL.
    stop_grace_period: 45s
    networks: [backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/marketplacehub-worker-heartbeat && find /tmp/marketplacehub-worker-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s

  caddy:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    image: marketplacehub-edge:f1-local
    restart: unless-stopped
    init: true
    networks: [edge, backend]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { MARKETPLACEHUB_SITE_ADDRESS: "${MARKETPLACEHUB_SITE_ADDRESS:-https://localhost}" }
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *local_logging
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  backup:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    profiles: ["operations"]
    restart: "no"
    networks: [backend]
    environment:
      PGHOST: postgres
      PGDATABASE: marketplacehub
      PGUSER: marketplacehub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - backup_staging:/backup
      - ../backup/backup.sh:/opt/marketplacehub/backup.sh:ro
      - app_files:/source/files:ro
      - dp_keys:/source/dp-keys:ro
    entrypoint: ["/bin/sh", "/opt/marketplacehub/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  validation-postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    profiles: ["validation"]
    restart: "no"
    networks: [validation]
    environment:
      POSTGRES_DB: marketplacehub_test
      POSTGRES_USER: marketplacehub
      POSTGRES_PASSWORD: validation-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplacehub -d marketplacehub_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  validation-tests:
    profiles: ["validation"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: validation
    image: marketplacehub-validation:local
    restart: "no"
    networks: [validation]
    environment:
      MARKETPLACEHUB_TEST_CONNECTION: "Host=validation-postgres;Port=5432;Database=marketplacehub_test;Username=marketplacehub;Password=validation-only"
      FeatureFlags__ExternalWrites: "false"
    depends_on:
      validation-postgres: { condition: service_healthy }

networks:
  edge: {}
  egress: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  validation:
    internal: true
volumes:
  pg_data: {}
  app_files: {}
  dp_keys: {}
  caddy_data: {}
  caddy_config: {}
  backup_staging: {}
secrets:
  postgres_password: { file: ../secrets/postgres_password.txt }
  app_db_connection: { file: ../secrets/app_db_connection.txt }
  credential_key: { file: ../secrets/credential_key.txt }
