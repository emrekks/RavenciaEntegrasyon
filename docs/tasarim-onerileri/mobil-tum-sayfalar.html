<!doctype html>
<html lang="tr">
<head>

<title>Mobil Görünüm · Tüm Sayfalar</title>
<style>
  :root {

    --bg: #111115; --surface: #17171c; --raised: #1d1d23; --soft: #22222a;

  h1, h2, h3, p { margin: 0; }

  .num { font-variant-numeric: tabular-nums; }
  .wrap { display: grid; gap: 28px; max-width: 1640px; margin: 0 auto; padding: 32px 24px 80px; }

  .frame { display: grid; gap: 10px; width: 392px; }
  .frame > header b { font-size: 14px; font-weight: 600; } .frame > header p { color: var(--muted); font-size: 12.5px; }
  /* phone */
  .phone { position: relative; width: 392px; height: 820px; padding: 8px; background: #2a2a31; border-radius: 44px; box-shadow: 0 30px 60px rgb(0 0 0 / 50%), inset 0 0 0 1px #3a3a44; }
  .screen { position: relative; width: 376px; height: 804px; overflow: hidden; background: var(--bg); border-radius: 36px; }
  .status { display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 26px; font-size: 12.5px; font-weight: 600; }
  .scroll { position: absolute; top: 36px; bottom: 0; left: 0; right: 0; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .page { display: grid; gap: 12px; padding: 12px 16px 120px; }

  .tb { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .tb .t { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib { display: grid; place-items: center; width: 40px; height: 40px; flex: none; color: var(--ink); background: none; border: 1px solid transparent; border-radius: 10px; cursor: pointer; position: relative; }
  .ib.b { border-color: var(--line-strong); background: var(--surface); }
  .ib .dotc { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; color: #fff; background: var(--bad); border-radius: 8px; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .ico { width: 18px; height: 18px; flex: none; } .ico.s { width: 14px; height: 14px; } .ico.l { width: 20px; height: 20px; }
  /* page head */
  .ph { display: grid; gap: 4px; } .ph .crumb { color: var(--subtle); font-size: 12px; font-weight: 500; } .ph h1 { font-size: 20px; font-weight: 600; line-height: 1.25; } .ph p { color: var(--muted); font-size: 13px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .acts.one { grid-template-columns: 1fr; } .acts.three { grid-template-columns: 1fr 1fr 1fr; }

  .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); } .btn.quiet { background: none; border-color: transparent; color: var(--muted); } .btn.link { height: auto; padding: 0; border: 0; background: none; color: var(--violet); font-size: 13px; }
  .btn.danger { color: var(--bad); }
  /* metrics */
  .mets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .met { display: grid; gap: 1px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .met small { color: var(--muted); font-size: 12px; } .met strong { font-size: 20px; font-weight: 600; line-height: 1.3; } .met span { color: var(--subtle); font-size: 11.5px; }
  .met.warn strong { color: var(--warn); } .met.bad strong { color: var(--bad); }
  /* tabs */
  .tabs { display: flex; gap: 0; height: 48px; padding: 0 6px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: inline-flex; flex: none; align-items: center; gap: 8px; height: 46px; padding: 0 12px; color: var(--muted); background: none; border: 0; font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .tab + .tab::before { content: ""; position: absolute; top: 50%; left: 0; width: 1px; height: 18px; background: var(--line-strong); transform: translateY(-50%); }
  .tab.on { color: var(--ink); } .tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: var(--primary); }
  .tab .c { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 1.5px 6px 0; color: var(--ink); background: var(--soft); border: 1px solid var(--line-strong); border-radius: 6px; font-size: 11.5px; line-height: 1; } .tab .c.warn { color: var(--warn); }

  .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; color: var(--subtle); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; font-size: 13.5px; min-width: 0; overflow: hidden; white-space: nowrap; }
  .fbtn { position: relative; } .fbtn .n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; color: #fff; background: var(--primary); border-radius: 9px; font-size: 10.5px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; color: var(--ink); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; } .chip .x { display: grid; place-items: center; width: 18px; height: 18px; color: var(--muted); }
  .listhead { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; } .listhead b { color: var(--ink); font-weight: 600; }
  /* cards */
  .card { display: grid; gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .card.sel { border-color: color-mix(in srgb, var(--primary) 70%, transparent); background: color-mix(in srgb, var(--primary-soft) 45%, var(--surface)); }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; } .row .grow { flex: 1; min-width: 0; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 6px; color: #fff; font-size: 10px; font-weight: 700; }
  .wm { height: 18px; padding: 1px 6px; border-radius: 5px; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
  .ono { font-weight: 600; font-size: 14px; } .meta { color: var(--subtle); font-size: 12px; } .muted { color: var(--muted); } .ink { color: var(--ink); }
  .strip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 500; }
  .strip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); } .strip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); } .strip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); } .strip.info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
  .strip b { margin-left: auto; font-weight: 600; }
  .pl { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
  .img { position: relative; width: 52px; aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(160deg, #3a3346, #22222a 70%); border: 1px solid var(--line); }
  .img .q { position: absolute; top: -6px; right: -6px; display: grid; place-items: center; width: 18px; height: 18px; color: #fff; background: var(--primary); border-radius: 50%; font-size: 10.5px; font-weight: 700; }
  .pt { font-size: 13px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; font-size: 12px; } .kv span { color: var(--subtle); } .kv b { font-weight: 500; overflow-wrap: anywhere; }
  .price { font-weight: 600; font-size: 13.5px; text-align: right; white-space: nowrap; }
  .sep { height: 1px; background: var(--line); }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; color: var(--muted); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); } .badge.info { color: var(--info); }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ring { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; } .ring svg { width: 18px; height: 18px; }
  .cacts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .cacts .btn { height: 38px; }
  .pm { display: flex; gap: 6px; } .pm span { position: relative; } .pm .logo { width: 26px; height: 26px; } .pm .off { opacity: .28; filter: grayscale(1); } .pm i { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border: 2px solid var(--surface); border-radius: 50%; background: var(--ok); }
  /* bottom bars & sheets */

  .bottombar .between b { font-size: 13.5px; } .bottombar small { color: var(--muted); font-size: 12px; }
  .scrim { position: absolute; inset: 0; z-index: 10; background: rgb(0 0 0 / 55%); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: 86%; background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 20px 20px 0 0; }
  .sheet.full { top: 36px; max-height: none; border-radius: 0; }
  .grab { width: 36px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--line-strong); }

  .sb { display: grid; gap: 14px; align-content: start; padding: 14px 16px; overflow-y: auto; scrollbar-width: none; }
  .sf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 22px; border-top: 1px solid var(--line); }
  .fld { display: grid; gap: 6px; } .fld > small { color: var(--subtle); font-size: 12px; font-weight: 500; }
  .in { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; padding: 0 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; font-size: 15px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .in.ph { color: var(--subtle); }
  .opts { display: grid; gap: 6px; } .opt { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px; } .opt.on { border-color: color-mix(in srgb, var(--primary) 70%, transparent); background: var(--primary-soft); }
  .radio { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--line-strong); border-radius: 50%; } .opt.on .radio { border: 5px solid var(--primary); }
  .cbx { width: 20px; height: 20px; flex: none; border: 1.5px solid var(--line-strong); border-radius: 6px; background: var(--bg); } .cbx.on { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--primary); position: relative; } .cbx.on::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .sec { display: grid; gap: 10px; } .sec > h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .kvt { display: grid; gap: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  .kvt > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); } .kvt > div:last-child { border-bottom: 0; } .kvt span { color: var(--muted); } .kvt b { font-weight: 500; text-align: right; overflow-wrap: anywhere; }
  .kvt > div.total b { font-weight: 700; }
  /* drawer */
  .drawer { position: absolute; top: 0; bottom: 0; left: 0; z-index: 11; width: 300px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--surface); border-right: 1px solid var(--line-strong); }
  .dnav { display: grid; gap: 2px; align-content: start; padding: 8px; overflow-y: auto; }
  .dnav a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; color: var(--muted); border-radius: 10px; font-size: 14.5px; text-decoration: none; } .dnav a.on { color: #fff; background: var(--primary); } .dnav a .c { margin-left: auto; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 1.5px 6px 0; color: var(--ink); background: var(--soft); border: 1px solid var(--line-strong); border-radius: 6px; font-size: 11.5px; line-height: 1; } .dnav a.on .c { background: rgb(255 255 255 / 18%); border-color: transparent; color: #fff; }

  .bar { display: block; height: 6px; overflow: hidden; border-radius: 3px; background: var(--line); } .bar b { display: block; height: 100%; border-radius: 3px; }
  .mx { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); } .mx i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); } .mx.warn { color: var(--warn); } .mx.warn i { background: var(--warn); } .mx.bad { color: var(--bad); } .mx.bad i { background: var(--bad); } .mx.off i { background: none; border: 1px dashed var(--line-strong); }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; }

  .msg { padding: 10px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; font-size: 13px; } .msg.me { justify-self: end; background: var(--primary-soft); border-radius: 12px 12px 4px 12px; }
  .stepper { display: flex; gap: 6px; } .stepper span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .stepper span.on { background: var(--primary); }
  @media (max-width: 860px) { .wrap { padding: 16px 8px 60px; } .gallery { grid-template-columns: 1fr; } }
</style>
