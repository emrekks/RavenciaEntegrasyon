<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravencia · Sade Tasarım</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101014; --surface: #17171c; --subtle: #1d1d23; --hover: #22222a;
    --line: #2a2a32; --line-strong: #383842;
    --ink: #ececf0; --ink-2: #a3a3b0; --ink-3: #6f6f7c;
    --accent: #8b5cf6; --accent-ink: #ffffff; --accent-soft: rgb(139 92 246 / 14%);
    --ok: #46b98f; --warn: #e2aa4b; --bad: #e4636f;
    --radius: 8px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f8; --surface: #ffffff; --subtle: #f4f4f6; --hover: #eeeef2;
    --line: #e4e4ea; --line-strong: #d3d3dc;
    --ink: #17171c; --ink-2: #5b5b68; --ink-3: #8c8c99;
    --accent: #6d3df0; --accent-ink: #ffffff; --accent-soft: rgb(109 61 240 / 9%);
    --ok: #1f9a6c; --warn: #b7791f; --bad: #c8414e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  button, select, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
  .grow { flex: 1; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; display: flex; height: 100vh; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  .brand i { display: grid; width: 28px; height: 28px; place-items: center; font-style: normal; color: var(--accent-ink); background: var(--accent); border-radius: 8px; font-size: 14px; }
  .nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .nav .sec { padding: 14px 20px 6px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
  .nav a { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 12px; height: 38px; padding: 0 20px 0 18px; color: var(--ink-2); text-decoration: none; border-left: 2px solid transparent; }
  .nav a:hover { color: var(--ink); background: var(--hover); }
  .nav a.on { color: var(--ink); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .nav a b { color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .nav a.on b { color: var(--ink-2); }
  .nav svg { width: 18px; height: 18px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .me .av { display: grid; width: 30px; height: 30px; place-items: center; background: var(--subtle); border: 1px solid var(--line-strong); border-radius: 50%; font-size: 12px; font-weight: 700; }
  .me small { display: block; color: var(--ink-3); }

  .main { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
  .crumb { color: var(--ink-3); } .crumb b { color: var(--ink); font-weight: 600; }
  .search { display: flex; align-items: center; gap: 8px; width: 280px; height: 34px; padding: 0 10px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; }
  .search kbd { margin-left: auto; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 4px; font-size: 11px; }
  .icon-btn { position: relative; display: grid; width: 34px; height: 34px; place-items: center; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; cursor: pointer; }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn .dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 28px 60px; }
  .view { display: none; } .view.on { display: block; }

  /* ---------- primitives ---------- */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 20px; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .head p { margin: 2px 0 0; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .card + .card, .stack > * + * { margin-top: 16px; }
  .card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .card-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-h p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .card-b { padding: 16px 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { color: var(--ink-2); background: none; border-color: transparent; }
  .btn.quiet:hover { color: var(--ink); background: var(--hover); }
  .btn.toggle[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .btn svg { width: 15px; height: 15px; }
  .in, select.in { height: 32px; width: 100%; padding: 0 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; outline: none; }
  textarea.in { height: auto; min-height: 96px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
  .in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fld { display: grid; gap: 6px; } .fld > small { color: var(--ink-3); font-size: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .tag.accent { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .tag.ok i { background: var(--ok); } .tag.warn i { background: var(--warn); } .tag.bad i { background: var(--bad); } .tag.acc i { background: var(--accent); }
  .tabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .tabs button { height: 42px; padding: 0; color: var(--ink-2); background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 500; }
  .tabs button b { margin-left: 6px; color: var(--ink-3); font-weight: 500; font-size: 12px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .tools .in { width: 260px; }
  .tools select.in { width: auto; }
  .track { height: 4px; overflow: hidden; background: var(--line); border-radius: 99px; } .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .st { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; flex: none; }
  .st.done { color: var(--ok); } .st.partial { color: var(--warn); } .st.none { color: var(--ink-3); } .st.bad { color: var(--bad); }

  .card:has(> table.t) { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; }
  .t th { height: 36px; padding: 0 16px; color: var(--ink-3); font-size: 12px; font-weight: 500; text-align: left; background: var(--subtle); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .t tr:last-child td { border-bottom: 0; }
  .t tbody tr:hover td { background: var(--hover); }
  .t .r { text-align: right; }
  .t td small { display: block; color: var(--ink-3); font-size: 12px; }
  .thumb { display: grid; width: 40px; height: 48px; flex: none; place-items: center; color: var(--ink-3); background: var(--subtle); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; }
  .prod { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .prod b { display: block; max-width: 320px; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .pl { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
  .pl i { display: grid; width: 18px; height: 18px; place-items: center; color: #fff; border-radius: 5px; font-size: 10px; font-style: normal; font-weight: 700; }
  .pl.ty i { background: #f27a1a; } .pl.hb i { background: #ff6000; } .pl.n11 i { background: #7b2dff; } .pl.pz i { background: #1a3dd9; } .pl.sh i { background: #5e8e3e; }
  .chk { width: 16px; height: 16px; accent-color: var(--accent); }
  .pager { display: flex; align-items: center; gap: 8px; padding: 12px 20px; color: var(--ink-2); border-top: 1px solid var(--line); }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { display: grid; gap: 4px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; }
  .kpi:hover { border-color: var(--line-strong); }
  .kpi span { color: var(--ink-2); font-size: 13px; }
  .kpi strong { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .kpi small { color: var(--ink-3); font-size: 12px; }
  .kpi.warn strong { color: var(--warn); }
  .dash { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
  .dash > .card + .card { margin-top: 0; }
  .chart { width: 100%; height: 220px; }
  .chart .grid line { stroke: var(--line); }
  .chart .prev { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .chart .cur { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .area { fill: var(--accent-soft); }
  .chart text { fill: var(--ink-3); font-size: 11px; }
  .big { display: flex; align-items: baseline; gap: 10px; }
  .big strong { font-size: 28px; font-weight: 600; }
  .delta { color: var(--bad); font-size: 13px; } .delta.up { color: var(--ok); }
  .bars { display: grid; gap: 14px; }
  .bars .b { display: grid; gap: 6px; }
  .bars .b > div:first-child { display: flex; justify-content: space-between; }
  .health { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .health > div { display: grid; gap: 4px; padding: 16px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .health > div:nth-child(3n) { border-right: 0; }
  .health > div:nth-last-child(-n+3) { border-bottom: 0; }
  .health span { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .health strong { font-size: 18px; font-weight: 600; }
  .health small { color: var(--ink-3); font-size: 12px; line-height: 1.45; }
  .health a { color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none; }

  /* ---------- master-detail (mapping, questions) ---------- */
  .md { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 560px; }
  .md-nav { max-height: 680px; overflow-y: auto; border-right: 1px solid var(--line); padding-bottom: 10px; }
  .md-nav .sec { display: flex; justify-content: space-between; padding: 14px 20px 6px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
  .md-nav .sec + .it { } .md-nav .it + .sec { margin-top: 8px; border-top: 1px solid var(--line); }
  .md-nav .it { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 6px 20px 6px 18px; text-align: left; background: none; border: 0; border-left: 2px solid transparent; cursor: pointer; }
  .md-nav .it:hover { background: var(--hover); }
  .md-nav .it.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .md-nav .it .meta { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  .md-nav .it span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .md-nav .it.q { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
  .md-nav .it.q span small { display: block; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .md-detail { display: flex; min-width: 0; flex-direction: column; padding: 22px 28px 0; }
  .md-detail h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 600; }
  .md-detail .lead { margin: 4px 0 20px; color: var(--ink-2); }
  .form2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .ro { display: flex; align-items: center; height: 32px; font-weight: 600; }
  .vtools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: center; gap: 16px; margin: 20px 0 12px; padding: 0 61px 0 17px; }
  .vtools .l { display: flex; align-items: baseline; gap: 10px; } .vtools h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .vtools .r { display: flex; align-items: center; gap: 8px; } .vtools .r .in { flex: 1; min-width: 0; }
  .vtable { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .vscroll { max-height: 300px; overflow: auto; }
  .vrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 28px; align-items: center; gap: 16px; min-height: 42px; padding: 5px 16px; border-top: 1px solid var(--line); }
  .vscroll > .vrow:first-child { border-top: 0; }
  .vrow.hd { min-height: 34px; color: var(--ink-3); font-size: 12px; background: var(--subtle); border-top: 0; border-bottom: 1px solid var(--line); }
  .vrow .ok { justify-self: end; }
  .foot { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; margin: 20px -28px 0; padding: 14px 28px; color: var(--ink-2); background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 12px 0; }
  .ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; background: var(--subtle); border-bottom: 1px solid var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 12px 20px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .bubble { max-width: 78%; padding: 10px 14px; background: var(--subtle); border: 1px solid var(--line); border-radius: 10px; }
  .bubble small { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-3); font-size: 12px; margin-bottom: 2px; }
  .bubble.me { align-self: flex-end; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .thread { display: flex; flex-direction: column; gap: 10px; padding: 16px 0; }

  /* ---------- integrations ---------- */
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid3 > .card + .card { margin-top: 0; }
  .icard { display: grid; grid-template-rows: auto 1fr auto; }
  .icard .top-row { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .icard .logo { display: grid; width: 38px; height: 38px; place-items: center; color: #fff; border-radius: 9px; font-weight: 700; }
  .icard h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .icard dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 0; padding: 16px 20px; }
  .icard dt { color: var(--ink-3); font-size: 12px; } .icard dd { margin: 2px 0 0; font-weight: 600; }
  .icard footer { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }

  /* ---------- product edit ---------- */
  .pe { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .pe > .card + .card { margin-top: 0; }
  .fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .fgrid .w2 { grid-column: span 2; } .fgrid .w3 { grid-column: 1 / -1; }
  .disclosure { width: 100%; padding: 14px 16px; text-align: left; background: var(--subtle); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .disclosure .t1 { display: flex; justify-content: space-between; font-weight: 600; }
  .disclosure small { display: block; margin-top: 4px; color: var(--ink-2); }
  .sticky-bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 14px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 -10px 30px rgb(0 0 0 / 25%); }

  /* ---------- settings ---------- */
  .settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
  .settings > .card + .card { margin-top: 0; }
  .snav { padding: 8px 0; } .snav a { display: block; padding: 8px 18px; color: var(--ink-2); text-decoration: none; border-left: 2px solid transparent; }
  .snav a.on { color: var(--ink); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; appearance: none; background: var(--line-strong); border-radius: 99px; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch:checked { background: var(--accent); } .switch:checked::after { transform: translateX(14px); }
  .srow { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .srow:first-child { border-top: 0; } .srow div { flex: 1; } .srow small { display: block; color: var(--ink-3); }

  .bulk { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 10px; width: fit-content; margin: 16px auto 0; padding: 10px 12px 10px 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 30px rgb(0 0 0 / 35%); }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dash, .pe { grid-template-columns: 1fr; } .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; } .side { display: none; }
    .page { padding: 16px; } .top { padding: 0 16px; } .search { display: none; }
    .kpis, .grid3, .health { grid-template-columns: 1fr; } .md, .settings { grid-template-columns: 1fr; }
    .md-nav { max-height: 260px; border-right: 0; border-bottom: 1px solid var(--line); }
    .form2, .fgrid, .vtools { grid-template-columns: 1fr; padding-inline: 0; } .fgrid .w2 { grid-column: auto; }
    .t { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><i>R</i>Ravencia</div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><span class="av">RA</span><div>Ravencia Admin<small>destek@ravencia.com</small></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <span class="crumb">Operasyon Merkezi › <b id="crumb">Genel Bakış</b></span>
      <span class="grow"></span>
      <span class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Sipariş, ürün veya müşteri ara<kbd>Ctrl K</kbd></span>
      <button class="icon-btn" title="Bildirimler"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg><span class="dot"></span></button>
      <button class="btn" id="theme">Açık Tema</button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>

<script>
const I = {
  home: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  box: '<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  cart: '<path d="m3 7 9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  ret: '<path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="m8 5-4 4 4 4"/>',
  inv: '<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6M9 7h3"/>',
  q: '<path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v3M12 13h.01"/>',

/* ---------------- router ---------------- */
// Navigation keeps its own state: the page also works where the address bar hash cannot change (file previews, embeds).
let current = (location.hash || '').slice(1) || 'dash'
function go(id) { current = id; try { history.replaceState(null, '', '#' + id) } catch {} render(); scrollTo(0, 0); document.querySelector('.page')?.scrollIntoView({ block: 'start' }) }
function render() {
  const id = current
  const page = pages.find(p => p.id === id) || pages[0]
  let g = ''
  document.getElementById('nav').innerHTML = pages.map(p => { const h = p.group && p.group !== g ? `<div class="sec">${(g = p.group)}</div>` : ''; return `${h}<a href="#${p.id}" class="${p.id === page.id ? 'on' : ''}">${svg(p.icon)}<span>${p.label}</span>${p.count ? `<b class="num">${p.count}</b>` : '<b></b>'}</a>` }).join('')
  document.getElementById('crumb').textContent = page.label
  document.getElementById('page').innerHTML = V[page.id]()
}
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) go(id) })
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]'); if (link) { e.preventDefault(); const id = link.getAttribute('href').slice(1); if (V[id]) go(id); return }
  const q = e.target.closest('[data-q]'); if (q) { qSel = +q.dataset.q; render(); return }
  const m = e.target.closest('[data-m]'); if (m) { mSel = +m.dataset.m; render(); return }
  if (e.target.closest('[data-only]')) { mOnly = !mOnly; render(); return }
  if (e.target.closest('[data-next]')) { const order = ATTRS.filter(x => x.r).concat(ATTRS.filter(x => !x.r)); const at = order.indexOf(ATTRS[mSel]); const nx = [...order.slice(at + 1), ...order.slice(0, at)].find(x => mState(x) !== 'done'); if (nx) { mSel = ATTRS.indexOf(nx); render() } return }
  const tb = e.target.closest('.tabs button'); if (tb) { tb.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === tb)) }
})
document.getElementById('theme').addEventListener('click', e => {
  const r = document.documentElement, light = r.dataset.theme !== 'light'
  r.dataset.theme = light ? 'light' : 'dark'; e.target.textContent = light ? 'Koyu Tema' : 'Açık Tema'
})
render()
