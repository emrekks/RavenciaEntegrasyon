<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performans ve Detay · 15 Öneri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #111115; --surface: #17171c; --raised: #1d1d23; --soft: #22222a;
    --line: #2a2a32; --line-strong: #383842;
    --ink: #ececf0; --muted: #a3a3b0; --subtle: #6f6f7c;
    --primary: #8b5cf6; --primary-soft: #272139;
    --violet: color-mix(in srgb, var(--primary) 55%, white);
    --warn: #e2aa4b; --bad: #e4636f; --ok: #46b98f; --info: #83b4ff;
    --hover: color-mix(in srgb, var(--raised) 60%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { display: grid; gap: 36px; max-width: 1196px; margin: 0 auto; padding: 32px 24px 96px; }
  .head h1 { font-size: 18px; font-weight: 600; } .head p { margin-top: 2px; color: var(--muted); font-size: 13px; } .head .crumb { color: var(--subtle); font-size: 12px; font-weight: 500; }
  .opt { display: grid; gap: 12px; }
  .opt > header h2 { font-size: 15px; font-weight: 600; } .opt > header p { margin-top: 2px; color: var(--muted); font-size: 13px; max-width: 90ch; }
  .card { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .ch { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; padding: 16px 16px 0; }
  .ch h3 { font-size: 16px; font-weight: 600; } .ch p { color: var(--muted); font-size: 13px; }
  .cb { padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .sel { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; font-size: 13px; cursor: pointer; }
  .sel svg { width: 14px; height: 14px; color: var(--muted); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px; }
  .seg button { height: 28px; padding: 0 10px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .seg button.on { color: var(--ink); background: var(--raised); border-color: var(--line-strong); }
  .total small { display: block; color: var(--muted); font-size: 13px; } .total strong { font-size: 26px; font-weight: 600; line-height: 1.25; }
  .trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; } .trend em { color: var(--subtle); font-style: normal; font-weight: 400; }
  .trend.up { color: var(--ok); } .trend.down { color: var(--bad); }
  .trend svg { width: 12px; height: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12.5px; } .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 3px; }
  .legend .ln { width: 16px; height: 0; border-radius: 0; border-top: 2px solid var(--violet); } .legend .dash { border-top: 2px dashed var(--subtle); }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { fill: var(--subtle); font-size: 11px; font-family: inherit; }
  svg.chart .g { stroke: var(--line); }
  .logo { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--violet); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .link svg { width: 14px; height: 14px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; }
  .rows { display: grid; gap: 8px; }
  .chrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
  .chrow .t { display: grid; gap: 4px; min-width: 0; } .chrow .t > span { display: flex; justify-content: space-between; gap: 8px; } .chrow .t small { color: var(--subtle); font-size: 12px; }
  .bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; border-radius: 3px; }
  .pct { font-weight: 600; } .delta { font-size: 12px; font-weight: 600; } .delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .kpi { display: grid; gap: 1px; padding: 12px 16px; text-align: left; color: var(--ink); background: none; border: 0; border-right: 1px solid var(--line); font: inherit; cursor: pointer; position: relative; }
  .kpi:last-child { border-right: 0; } .kpi:hover { background: var(--hover); }
  .kpi small { color: var(--muted); font-size: 12.5px; } .kpi strong { font-size: 18px; font-weight: 600; }
  .kpi.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.t th { padding: 9px 12px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: right; background: var(--raised); border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); }
  table.t tr:last-child td { border-bottom: 0; } table.t tr:hover td { background: var(--hover); }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t td .nm { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .ins { display: grid; gap: 8px; }
  .insi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .insi .ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); color: var(--violet); }
  .insi .ic svg { width: 16px; height: 16px; } .insi b { display: block; font-weight: 600; } .insi span { color: var(--muted); font-size: 12.5px; }
  .tip { position: absolute; z-index: 10; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 18px 50px rgb(0 0 0 / 45%); font-size: 12px; pointer-events: none; white-space: nowrap; }
  .tip b { display: block; margin-bottom: 2px; font-weight: 600; } .tip span { color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; color: var(--muted); background: none; border: 1px solid var(--line-strong); border-radius: 999px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; } .chip.on { color: var(--ink); background: var(--raised); } .chip.off { opacity: .45; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } .kpi:nth-child(2) { border-right: 0; } .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
  @media (max-width: 760px) { .wrap { padding: 16px 16px 96px; } .table-wrap { overflow-x: auto; } }
  /* combined performance block */
  .kgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kgrid .kc { border-right: 1px solid var(--line); } .kgrid .kc:last-child { border-right: 0; }
  .kgrid.tabs .kc { cursor: pointer; } .kgrid.tabs .kc:hover { background: var(--hover); }
  .kc { position: relative; display: grid; gap: 4px; align-content: start; padding: 14px 16px; min-width: 0; }
  .kc small { color: var(--muted); font-size: 13px; } .kc > strong { font-size: 24px; font-weight: 600; line-height: 1.25; } .kc .avg { margin-top: 2px; color: var(--muted); font-size: 12.5px; } .kc .avg b { color: var(--ink); font-weight: 600; }
  .kc.on { background: color-mix(in srgb, var(--raised) 70%, transparent); } .kc.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
  .g4c { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ptabs, .vtab { display: flex; gap: 0; padding: 0 8px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .ptabs button, .vtab button { position: relative; display: inline-flex; flex: none; align-items: center; gap: 8px; height: 46px; padding: 0 12px; color: var(--muted); background: none; border: 0; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .ptabs button.on, .vtab button.on { color: var(--ink); font-weight: 500; } .ptabs button.on::after, .vtab button.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: var(--primary); }
  .ptabs .logo { width: 20px; height: 20px; font-size: 9px; } .subtle { color: var(--subtle); font-size: 12px; }
  @media (max-width: 1100px) { .kgrid, .g4c { grid-template-columns: 1fr 1fr; } .kgrid .kc:nth-child(2) { border-right: 0; } .kgrid .kc:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
  @media (max-width: 760px) { .kgrid, .g4c { grid-template-columns: 1fr; } .kgrid .kc { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
/* ---------- data ---------- */
const P = [['Trendyol', '#f27a1a', 'T'], ['Hepsiburada', '#ff6000', 'H'], ['Shopify', '#5e8e3e', 'S'], ['N11', '#7c5cff', 'n'], ['Pazarama', '#2f9bd8', 'P']]
const SHARE = [58, 21, 11, 7, 3], REV = ['₺348.500', '₺126.180', '₺66.090', '₺42.060', '₺18.028'], ORD = [629, 228, 119, 76, 32], AOV = ['₺554', '₺553', '₺555', '₺553', '₺563'], DLT = [14.2, 9.8, 21.4, -3.1, 6.0]
const N = 30
const D = Array.from({ length: N }, (_, i) => new Date(2026, 8, 18 + i))
const cur = Array.from({ length: N }, (_, i) => Math.round(14000 + 6000 * Math.sin(i / 3.2) + 4200 * Math.sin(i / 1.3 + 1) + i * 260 + (i % 7 === 5 ? 6500 : 0)))
const prev = Array.from({ length: N }, (_, i) => Math.round(12500 + 5000 * Math.sin(i / 2.7 + 2) + 3000 * Math.cos(i / 1.6) + i * 140))
const byP = cur.map((v, i) => SHARE.map((s, j) => Math.max(0, v * s / 100 * (1 + .25 * Math.sin(i / (2 + j) + j)))))
const tl = n => '₺' + Math.round(n).toLocaleString('tr-TR')
const sum = a => a.reduce((x, y) => x + y, 0)
const ds = d => d.getDate() === 1 ? `1 ${['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'][d.getMonth()]}` : `${d.getDate()}`
const ico = p => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`
const I = { chev: ico('<path d="m4.5 6 3.5 3.5L11.5 6"/>'), up: ico('<path d="M4 10l4-4 4 4"/>'), down: ico('<path d="M4 6l4 4 4-4"/>'), arrow: ico('<path d="M3 8h10M9 4l4 4-4 4"/>'), star: ico('<path d="M8 2.2 9.7 5.7l3.8.5-2.8 2.7.7 3.8L8 10.9l-3.4 1.8.7-3.8-2.8-2.7 3.8-.5z"/>'), dip: ico('<path d="M3 5l4 4 2.5-2.5L13 10M10 10h3V7"/>'), cal: ico('<rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/>'), cart: ico('<path d="M1.5 2.5h2l1.6 7.4a1 1 0 0 0 1 .8h5.6a1 1 0 0 0 1-.8L14.5 5.5H4.4"/>'), bolt: ico('<path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/>'), dl: ico('<path d="M8 2.5v8M4.8 7.5 8 10.7l3.2-3.2"/><path d="M2.5 10.5v3h11v-3"/>') }
const logo = j => `<span class="logo" style="background:${P[j][1]}">${P[j][2]}</span>`
const sel = l => `<button class="sel">${l}${I.chev}</button>`
const trend = (t, up = true) => `<span class="trend ${up ? 'up' : 'down'}">${up ? I.up : I.down}${t}<em>önceki döneme göre</em></span>`
const totalBlock = (l = 'Son 30 Gün', v = tl(sum(cur)), t = '%12,3') => `<div class="total"><small>${l}</small><strong class="num">${v}</strong>${trend(t)}</div>`
const head = (t, d, right = '') => `<div class="ch"><div><h3>${t}</h3><p>${d}</p></div>${right}</div>`

/* ---------- svg helpers ---------- */
function frame(W, H, max, { L = 56, R = 8, T = 10, B = 26, ticks = 5, money = true } = {}) {
  const x = i => L + i / (N - 1) * (W - L - R), y = v => T + (1 - v / max) * (H - T - B)
  const grid = Array.from({ length: ticks + 1 }, (_, i) => { const v = max / ticks * i; return `<line class="g" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${money ? (v ? '₺' + Math.round(v / 1000) + ' B' : '₺0') : Math.round(v)}</text>` }).join('')
  const xs = D.map((d, i) => i % 5 === 0 || d.getDate() === 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${ds(d)}</text>` : '').join('')
  return { x, y, grid: grid + xs, W, H, L, R, T, B }
}
const path = (arr, f) => arr.map((v, i) => `${i ? 'L' : 'M'}${f.x(i).toFixed(1)} ${f.y(v).toFixed(1)}`).join(' ')
const smooth = (arr, f) => { let d = `M${f.x(0)} ${f.y(arr[0])}`; for (let i = 1; i < arr.length; i++) { const x0 = f.x(i - 1), x1 = f.x(i), y0 = f.y(arr[i - 1]), y1 = f.y(arr[i]), cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}` } return d }
const maxOf = (...a) => Math.ceil(Math.max(...a.flat()) / 10000) * 10000
let gid = 0
function areaChart({ W = 760, H = 260, series = cur, prevSeries = prev, markers = false, target = null, smoothLine = false, color = 'var(--violet)' } = {}) {
  const f = frame(W, H, maxOf(series, prevSeries || [0], target ? [target] : [0])), id = 'ag' + (++gid)
  const ln = smoothLine ? smooth(series, f) : path(series, f)
  const mk = markers ? (() => { const hi = series.indexOf(Math.max(...series)), lo = series.indexOf(Math.min(...series)); return `<circle cx="${f.x(hi)}" cy="${f.y(series[hi])}" r="4.5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2"/><text x="${f.x(hi)}" y="${f.y(series[hi]) - 10}" text-anchor="middle" style="fill:var(--ok);font-weight:600">En yüksek ${tl(series[hi])}</text><circle cx="${f.x(lo)}" cy="${f.y(series[lo])}" r="4.5" fill="var(--surface)" stroke="var(--bad)" stroke-width="2"/><text x="${f.x(lo)}" y="${f.y(series[lo]) + 20}" text-anchor="middle" style="fill:var(--bad);font-weight:600">En düşük ${tl(series[lo])}</text>` })() : ''
  const tg = target ? `<line x1="${f.L}" x2="${W - f.R}" y1="${f.y(target)}" y2="${f.y(target)}" stroke="var(--warn)" stroke-dasharray="6 4"/><text x="${W - f.R}" y="${f.y(target) - 6}" text-anchor="end" style="fill:var(--warn)">Günlük hedef ${tl(target)}</text>` : ''
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>${f.grid}${tg}<path d="${ln} L${f.x(N - 1)} ${f.y(0)} L${f.x(0)} ${f.y(0)} Z" fill="url(#${id})"/>${prevSeries ? `<path d="${smoothLine ? smooth(prevSeries, f) : path(prevSeries, f)}" fill="none" stroke="var(--subtle)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}<path d="${ln}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${mk}</svg>`
}
function stackedArea({ W = 760, H = 260, hidden = [] } = {}) {
  const tops = byP.map(r => r.reduce((a, v, j) => a + (hidden.includes(j) ? 0 : v), 0))
  const f = frame(W, H, maxOf(tops))
  let base = Array(N).fill(0), out = ''
  SHARE.forEach((_, j) => { if (hidden.includes(j)) return; const top = byP.map((r, i) => base[i] + r[j]); out += `<path d="${path(top, f)} ${[...base].reverse().map((v, k) => `L${f.x(N - 1 - k).toFixed(1)} ${f.y(v).toFixed(1)}`).join(' ')} Z" fill="${P[j][1]}" fill-opacity=".72" stroke="${P[j][1]}" stroke-width="1"/>`; base = top })
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${f.grid}${out}</svg>`
}
function barsChart({ W = 760, H = 240, series = cur, prevSeries = prev, highlight = -1 } = {}) {
  const f = frame(W, H, maxOf(series, prevSeries)), bw = (W - f.L - f.R) / N * .62
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${f.grid}${series.map((v, i) => `<rect x="${f.x(i) - bw / 2}" y="${f.y(v)}" width="${bw}" height="${f.y(0) - f.y(v)}" rx="2" fill="${i === highlight ? 'var(--violet)' : 'color-mix(in srgb, var(--violet) 55%, transparent)'}"><title>${D[i].toLocaleDateString('tr-TR')} · ${tl(v)}</title></rect>`).join('')}<path d="${path(prevSeries, f)}" fill="none" stroke="var(--subtle)" stroke-width="1.5" stroke-dasharray="4 4"/></svg>`
}
const spark = (arr, c, w = 120, h = 28) => { const mx = Math.max(...arr), mn = Math.min(...arr); return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none"><path d="${arr.map((v, i) => `${i ? 'L' : 'M'}${(i / (arr.length - 1) * w).toFixed(1)} ${(2 + (1 - (v - mn) / (mx - mn || 1)) * (h - 4)).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>` }
const chanRows = (withDelta = true) => `<div class="rows">${SHARE.map((s, j) => `<div class="chrow">${logo(j)}<span class="t"><span><b style="font-weight:500">${P[j][0]}</b><small class="num">${REV[j]}</small></span><span class="bar"><b style="width:${s}%;background:${P[j][1]}"></b></span></span><span style="display:grid;justify-items:end"><span class="pct num">%${s}</span>${withDelta ? `<span class="delta ${DLT[j] >= 0 ? 'up' : 'down'} num">${DLT[j] >= 0 ? '+' : ''}%${Math.abs(DLT[j]).toLocaleString('tr-TR')}</span>` : ''}</span></div>`).join('')}</div>`
const donut = (size = 150, inner = 104, label = 'Toplam Sipariş', val = '1.084') => { let a = 0; const st = SHARE.map((s, j) => { const r = `${P[j][1]} ${a}% ${a + s}%`; a += s; return r }).join(', '); return `<div style="display:grid;place-items:center;width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${st});flex:none"><div style="display:grid;justify-items:center;align-content:center;width:${inner}px;height:${inner}px;border-radius:50%;background:var(--surface);text-align:center"><small style="color:var(--muted);font-size:11.5px">${label}</small><strong class="num" style="font-size:20px;font-weight:600;line-height:1.2">${val}</strong></div></div>` }
const stack100 = (h = 12) => `<span style="display:flex;height:${h}px;border-radius:${h / 2}px;overflow:hidden">${SHARE.map((s, j) => `<i style="width:${s}%;background:${P[j][1]}" title="${P[j][0]} %${s}"></i>`).join('')}</span>`
const chips = (hidden = []) => `<div class="tools">${SHARE.map((_, j) => `<button class="chip ${hidden.includes(j) ? 'off' : 'on'}"><i style="background:${P[j][1]}"></i>${P[j][0]}</button>`).join('')}</div>`

/* ---------- metrics (performance row) ---------- */
const M = [
  { l: 'Toplam Gelir', v: tl(612480), prev: tl(545380), t: '%12,3', up: true, avg: '₺20.416', min: '₺11.820', max: '₺38.940', pos: .38, goal: ['₺750.000', .82], ser: cur, unit: 'ciro' },
  { l: 'Toplam Sipariş', v: '1.084', prev: '1.003', t: '%8,1', up: true, avg: '36', min: '18', max: '71', pos: .34, goal: ['1.300', .83], ser: cur.map(v => v / 560), unit: 'sipariş' },
  { l: 'Ortalama Sepet', v: '₺565', prev: '₺544', t: '%3,9', up: true, avg: '₺565', min: '₺412', max: '₺748', pos: .45, goal: ['₺600', .94], ser: cur.map((v, i) => 520 + 60 * Math.sin(i / 2.5)), unit: 'sepet' },
  { l: 'Aktif Ürün', v: '356', prev: '360', t: '-%1,2', up: false, avg: '356', min: '349', max: '363', pos: .5, goal: ['400', .89], ser: cur.map((v, i) => 356 + 4 * Math.sin(i / 4)), unit: 'ürün' },
]
const tr = (m, short) => `<span class="trend ${m.up ? 'up' : 'down'}">${m.up ? I.up : I.down}${m.t}${short ? '' : '<em>önceki döneme göre</em>'}</span>`
const range = m => `<div style="display:grid;gap:4px"><span style="position:relative;display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--violet) 25%,transparent),color-mix(in srgb,var(--violet) 75%,transparent))"><i style="position:absolute;top:50%;left:${m.pos * 100}%;width:12px;height:12px;border:2px solid var(--surface);border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)"></i></span><span style="display:flex;justify-content:space-between;color:var(--subtle);font-size:11.5px"><span class="num">${m.min}</span><span class="num">${m.max}</span></span></div>`

add(1, 'Metrikler Grafiği Yönetir', 'Dört metrik kartı aynı zamanda grafiğin sekmesi: tıklanan metrik altta çizilir, seçili kart mor çizgiyle işaretli. Kanallar sağda aynı metriğe göre. Tek dönem seçimi iki satırı birden yönetir.',
  `<article class="card"><div class="ch"><div><h3>Performans</h3><p>Son 30 gün · önceki eşit dönemle karşılaştırma</p></div><div class="tools">${periodSeg}${sel('Tüm Platformlar')}</div></div><div class="kgrid tabs">${M.map((m, i) => kpiCell(m, { on: i === 0 })).join('')}</div><div class="cb split" style="padding-top:16px;align-items:start"><div style="display:grid;gap:10px">${areaChart({ H: 250 })}${legendCur}</div><div style="display:grid;gap:12px;padding-left:16px;border-left:1px solid var(--line)"><div class="total"><small>Kanallara Göre Ciro</small></div>${stack100(10)}${chanRows()}<a class="link" href="#">Kanalları Yönet ${I.arrow}</a></div></div></article>`)

add(2, 'Solda Metrik Sütunu', 'Metrikler solda dar bir sütunda alt alta, grafik ortada geniş, kanallar sağda. Üç bilgi aynı yükseklikte; sayfa iki satır yerine tek sıra kaplar.',
  `<div style="display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px" class="c3"><div style="display:grid;gap:10px">${M.map(m => `<article class="card">${kpiCell(m, { rangeBar: false, sp: true, compact: true })}</article>`).join('')}</div><article class="card">${head('Gelir Performansı', 'Günlük ciro', `<div class="tools">${sel('Son 30 Gün')}</div>`)}<div class="cb">${totalBlock()}${areaChart({ H: 280 })}${legendCur}</div></article><article class="card">${head('Satış Kanalları', 'Ciro payı')}<div class="cb" style="justify-items:center">${donut(150, 104, 'Sipariş', '1.084')}<div style="width:100%">${chanRows()}</div></div></article></div><style>@media (max-width:1100px){.c3{grid-template-columns:1fr!important}}</style>`)

add(3, 'Tek Kart, Üstte Metrik Şeridi', 'Metrikler ayrı kartlar yerine grafiğin kartının üst şeridinde, ince çizgilerle ayrılmış. Kanallar grafiğin altında tek şerit ve lejant. Ekranda bir kart, sıfır tekrar.',
  `<article class="card"><div class="ch"><div><h3>Performans</h3><p>Son 30 gün</p></div><div class="tools">${periodSeg}</div></div><div class="kgrid strip">${M.map(m => kpiCell(m)).join('')}</div><div class="cb" style="padding-top:16px">${areaChart({ H: 240 })}<div style="display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:13px"><b style="font-weight:600">Satış Kanalları</b><a class="link" href="#">Kanalları Yönet ${I.arrow}</a></div>${stack100(12)}<div class="legend">${SHARE.map((s, j) => `<span><i style="background:${P[j][1]}"></i>${P[j][0]} %${s} · ${REV[j]}</span>`).join('')}</div></div></div></article>`)

add(4, 'Gelir Önde', 'Toplam Gelir kartı grafiği de taşıyan büyük kart oldu; diğer üç metrik sağda kısa kartlar. Kanallar en altta beş küçük kutu; her biri ciro, pay ve değişimle.',
  `<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px" class="c2"><article class="card">${head('Toplam Gelir', 'Son 30 gün', `<div class="tools">${periodSeg}</div>`)}<div class="cb"><div style="display:flex;flex-wrap:wrap;align-items:end;gap:8px 24px"><strong class="num" style="font-size:32px;font-weight:600;line-height:1.1">${M[0].v}</strong>${tr(M[0])}<span class="avg" style="color:var(--muted);font-size:13px">Günlük ortalama <b class="num" style="color:var(--ink)">${M[0].avg}</b></span></div>${areaChart({ H: 230 })}</div></article><div style="display:grid;gap:12px">${M.slice(1).map(m => `<article class="card">${kpiCell(m, { compact: true })}</article>`).join('')}</div></div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:4px" class="c5">${SHARE.map((s, j) => `<article class="card" style="display:grid;gap:4px;padding:12px 14px"><span style="display:flex;align-items:center;gap:8px;font-size:13px">${logo(j)}<b style="font-weight:500;flex:1">${P[j][0]}</b><span class="pct num">%${s}</span></span><strong class="num" style="font-size:16px;font-weight:600">${REV[j]}</strong><span class="delta ${DLT[j] >= 0 ? 'up' : 'down'} num">${DLT[j] >= 0 ? '+' : '−'}%${Math.abs(DLT[j]).toLocaleString('tr-TR')} önceki döneme göre</span></article>`).join('')}</div><style>@media (max-width:1100px){.c2,.c5{grid-template-columns:1fr 1fr!important}}@media (max-width:760px){.c2,.c5{grid-template-columns:1fr!important}}</style>`)

add(5, 'Platform Sekmeleri', 'En üstte platform sekmeleri; seçilen platform iki satırı birden süzer: metrikler, grafik ve kanal payı o platforma göre yenilenir. "Hepsiburada nasıl gidiyor?" tek tıkla.',
  `<article class="card"><div class="ptabs">${['Tüm Platformlar', ...P.map(p => p[0])].map((p, i) => `<button class="${i === 0 ? 'on' : ''}">${i ? logo(i - 1) : ''}${p}${i ? `<span class="num subtle">%${SHARE[i - 1]}</span>` : ''}</button>`).join('')}</div><div class="kgrid strip">${M.map(m => kpiCell(m, { rangeBar: false, sp: true })).join('')}</div><div class="cb split" style="padding-top:16px;align-items:start"><div>${areaChart({ H: 240 })}</div><div style="display:grid;gap:10px;padding-left:16px;border-left:1px solid var(--line)"><b style="font-size:13px">Platform Payları</b>${chanRows()}</div></div></article>`)

add(6, 'Grafik İçinde Özet', 'Grafik tam genişlikte, metrikler grafiğin üstünde yarı saydam şeritte; kanallar grafiğin lejantı olarak tıklanabilir. Göz önce eğilime, sonra sayılara gider.',
  `<article class="card">${head('Performans', 'Son 30 gün', `<div class="tools">${periodSeg}</div>`)}<div class="cb"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden" class="ov4">${M.map(m => `<div style="display:grid;gap:1px;padding:10px 14px;background:var(--raised);border-right:1px solid var(--line)"><small style="color:var(--muted);font-size:12.5px">${m.l}</small><span style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><strong class="num" style="font-size:20px;font-weight:600">${m.v}</strong>${tr(m, true)}</span></div>`).join('')}</div>${stackedArea({ H: 260 })}${chips([])}</div></article><style>@media (max-width:760px){.ov4{grid-template-columns:1fr 1fr!important}}</style>`)

add(7, 'Dörtlü Metrik ve Kanal Tablosu', 'Solda 2×2 metrik kutusu, sağda grafik; altta kanal tablosu her metriği kanal kanal kırar. Metrik kartlarındaki rakamların kaynağı tabloda görünür.',
  `<article class="card">${head('Performans', 'Son 30 gün', `<div class="tools">${periodSeg}</div>`)}<div class="cb" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:start" class="c27"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${M.map(m => `<div style="border:1px solid var(--line);border-radius:10px;background:var(--raised)">${kpiCell(m, { rangeBar: false, compact: true })}</div>`).join('')}</div>${areaChart({ H: 220 })}</div><div class="table-wrap"><table class="t"><thead><tr><th>Kanal</th><th>Ciro</th><th>Sipariş</th><th>Ortalama Sepet</th><th>Pay</th><th>Değişim</th></tr></thead><tbody>${SHARE.map((s, j) => `<tr><td><span class="nm">${logo(j)}${P[j][0]}</span></td><td class="num">${REV[j]}</td><td class="num">${ORD[j]}</td><td class="num">${AOV[j]}</td><td class="num">%${s}</td><td class="num"><span class="delta ${DLT[j] >= 0 ? 'up' : 'down'}">${DLT[j] >= 0 ? '+' : '−'}%${Math.abs(DLT[j]).toLocaleString('tr-TR')}</span></td></tr>`).join('')}<tr style="font-weight:600"><td>Toplam</td><td class="num">${M[0].v}</td><td class="num">${M[1].v}</td><td class="num">${M[2].v}</td><td class="num">%100</td><td class="num"><span class="delta up">+%12,3</span></td></tr></tbody></table></div></article>`)

add(8, 'Bu Dönem · Önceki Dönem', 'Her metrik iki dönemi yan yana gösterir; grafik dönem başından bugüne biriken ciroyu önceki dönemle karşılaştırır, aradaki fark yeşil alan. Kanallar değişimlerine göre sıralı.',

add(9, 'Öne Çıkanlarla', 'Metrikler kompakt bir şeritte; grafiğin yanında halka yerine panelin çıkarımları: en iyi gün, hafta sonu payı, büyüyen ve gerileyen kanal. Rakamlar yorumuyla gelir.',

add(10, 'Hedefe Göre', 'Her metrik dönem hedefinin yüzde kaçında olduğunu halkayla gösterir; grafikte günlük hedef çizgisi, kanallarda kanal hedefine ilerleme. Ekip hedefle çalışıyorsa en verimlisi.',

add(11, 'Seçili Gün Senkronu', 'Grafikte bir güne gelindiğinde metrik kartları o günün değerine döner ve "Dönem" yerine "13 Ekim" yazar; kanal payı da o güne göre değişir. İki satır birbirine bağlı.',
  `<div class="g4c">${M.map((m, i) => `<article class="card" style="${i === 0 ? 'border-color:var(--line-strong)' : ''}"><div class="kc"><small>${m.l} · <span style="color:var(--violet)">13 Ekim</span></small><strong class="num">${[tl(38940), '69', '₺564', '356'][i]}</strong><span class="subtle">Dönem toplamı ${m.v}</span>${range({ ...m, pos: [.98, .96, .5, .5][i] })}</div></article>`).join('')}</div><div class="split" style="margin-top:4px"><article class="card">${head('Gelir Performansı', 'Grafikte gezinin; metrikler o güne geçer', `<div class="tools">${sel('Son 30 Gün')}</div>`)}<div class="cb" style="position:relative">${areaChart({ H: 250 }).replace('</svg>', (() => { const f = frame(760, 250, maxOf(cur, prev)); const i = 25; return `<line x1="${f.x(i)}" x2="${f.x(i)}" y1="${f.T}" y2="${250 - f.B}" stroke="var(--line-strong)"/><circle cx="${f.x(i)}" cy="${f.y(cur[i])}" r="5" fill="var(--surface)" stroke="var(--violet)" stroke-width="2"/></svg>` })())}${legendCur}</div></article><article class="card">${head('Kanal Payı · 13 Ekim', 'Seçilen günün dağılımı')}<div class="cb" style="justify-items:center">${donut(150, 104, '13 Ekim', '69 sipariş')}<div style="width:100%">${chanRows(false)}</div></div></article></div>`)

add(12, 'Kanal × Metrik Tablosu', 'İki satırın yerine tek tablo: üst satır toplam (metrik kartlarının yerini alır), altında her kanal; her hücrede değer ve değişim, en sağda kanalın eğrisi. En yoğun ve en karşılaştırılabilir görünüm.',
  `<article class="card">${head('Performans', 'Son 30 gün · kanal kanal', `<div class="tools">${periodSeg}<button class="sel">${I.dl}Dışa Aktar</button></div>`)}<div class="table-wrap"><table class="t"><thead><tr><th>Kanal</th><th>Gelir</th><th>Sipariş</th><th>Ortalama Sepet</th><th>Pay</th><th>Günlük Ortalama</th><th>Son 30 Gün</th></tr></thead><tbody><tr style="background:var(--raised)"><td><b>Tüm Kanallar</b></td>${[[M[0].v, '+%12,3'], [M[1].v, '+%8,1'], [M[2].v, '+%3,9']].map(([v, d]) => `<td class="num"><b style="font-size:15px">${v}</b><br><span class="delta up">${d}</span></td>`).join('')}<td class="num">%100</td><td class="num">${M[0].avg}</td><td>${spark(cur, 'var(--violet)', 120, 26)}</td></tr>${SHARE.map((s, j) => `<tr><td><span class="nm">${logo(j)}${P[j][0]}</span></td><td class="num">${REV[j]}<br><span class="delta ${DLT[j] >= 0 ? 'up' : 'down'}">${DLT[j] >= 0 ? '+' : '−'}%${Math.abs(DLT[j]).toLocaleString('tr-TR')}</span></td><td class="num">${ORD[j]}</td><td class="num">${AOV[j]}</td><td class="num"><span style="display:inline-grid;grid-template-columns:60px auto;gap:8px;align-items:center"><span class="bar"><b style="width:${s}%;background:${P[j][1]}"></b></span>%${s}</span></td><td class="num">${tl(parseInt(REV[j].replace(/\D/g, '')) / 30)}</td><td>${spark(byP.map(r => r[j]), P[j][1], 120, 26)}</td></tr>`).join('')}</tbody></table></div></article>`)
