<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raporlar · Genel Bakış · 10 Öneri</title>
<!-- Ten directions for the Reports overview. Every proposal reads the same figures: the last 30 days (24.09–23.10.2026)
     as the live panel showed them, the daily sales, platform split and best sellers read from live (read-only), rounded.
     One flow everywhere: sales − costs (product cost, commission, cargo, returned amount, other deductions) = what is left. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #101014; --surface: #17171c; --raised: #1d1d23; --soft: #22222a;
    --line: #2a2a32; --line-strong: #383842;
    --ink: #ececf0; --muted: #a3a3b0; --subtle: #8a8a99;
    --primary: #8b5cf6; --primary-soft: #272139;
    --ok: #46b98f; --ok-soft: #1e2e2c; --warn: #e2aa4b; --warn-soft: #332c23; --bad: #e4636f; --bad-soft: #342228; --info: #83b4ff;
    --c-cost: #8b5cf6; --c-commission: #83b4ff; --c-cargo: #e2aa4b; --c-return: #e4636f; --c-other: #8a8a99; --c-left: #46b98f;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }

  /* Picker */
  .picker { position: sticky; top: 0; z-index: 10; display: grid; gap: 10px; padding: 14px 24px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
  .picker-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .picker-head h1 { font-size: 15px; font-weight: 600; }
  .picker-head p { color: var(--subtle); font-size: 12px; }
  .picker nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .picker nav button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; color: var(--muted); cursor: pointer; transition: color .16s, background-color .16s, border-color .16s; }
  .picker nav button b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--soft); color: var(--subtle); font-size: 11px; font-weight: 600; }
  .picker nav button:hover { color: var(--ink); border-color: var(--line-strong); }
  .picker nav button[aria-pressed="true"] { color: var(--ink); background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 55%, transparent); }
  .picker nav button[aria-pressed="true"] b { background: var(--primary); color: #fff; }

  /* Page frame shared by every proposal */
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
  .intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 22px; }
  .intro h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .intro p { max-width: 64ch; margin-top: 4px; color: var(--muted); }
  .intro .period { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; white-space: nowrap; }
  .card { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .card > h3 { margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .card > h3 small { margin-left: 6px; color: var(--subtle); font-size: 12px; font-weight: 400; }
  .label { color: var(--muted); font-size: 12px; }
  .note { color: var(--subtle); font-size: 12px; }
  .delta { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .delta.good { color: var(--ok); background: var(--ok-soft); }
  .delta.bad { color: var(--bad); background: var(--bad-soft); }
  .money-neg { color: var(--bad); }
  .money-pos { color: var(--ok); }
  .tip { position: fixed; z-index: 20; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: 0 12px 28px -12px #000; font-size: 12px; pointer-events: none; }
  .tip b { display: block; font-size: 13px; }
  section.proposal { animation: rise .42s cubic-bezier(.22, 1, .36, 1) backwards; }
  @keyframes rise { from { opacity: 0; translate: 0 12px; } }
  .grow { animation: grow .9s cubic-bezier(.22, 1, .36, 1) backwards; transform-box: fill-box; transform-origin: bottom; }
  @keyframes grow { from { transform: scaleY(0); } }
  .growx { animation: growx .9s cubic-bezier(.22, 1, .36, 1) backwards; transform-origin: left; }
  @keyframes growx { from { transform: scaleX(0); } }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.22, 1, .36, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { section.proposal, .grow, .growx { animation: none !important; } .draw { animation: none !important; stroke-dashoffset: 0; } }

  /* 1 · Defter */
  #p1 .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  #p1 table { width: 100%; border-collapse: collapse; }
  #p1 th { padding: 0 0 10px; color: var(--subtle); font-size: 12px; font-weight: 500; text-align: right; }
  #p1 th:first-child { text-align: left; }
  #p1 td { padding: 11px 0 11px 12px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  #p1 td:first-child { width: 40%; padding-left: 0; text-align: left; white-space: normal; }
  #p1 td .bar { display: block; height: 4px; margin-top: 7px; border-radius: 2px; background: var(--soft); overflow: hidden; }
  #p1 td .bar i { display: block; height: 100%; border-radius: 2px; }
  #p1 tr.minus td:first-child { padding-left: 16px; color: var(--muted); }
  #p1 tr.total td { font-weight: 700; border-top: 1px solid var(--line-strong); }
  #p1 tr.result td { padding-top: 14px; border-top: 2px solid var(--ink); font-size: 18px; font-weight: 700; }
  #p1 tr.result td:nth-child(2) { color: var(--ok); }
  #p1 .side { display: grid; gap: 20px; }
  #p1 .kv { display: grid; gap: 12px; }
  #p1 .kv div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #p1 .kv strong { font-size: 18px; }
  #p1 .scroll { overflow-x: auto; }

  /* 2 · Şelale */
  #p2 .hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  #p2 .hero .card strong { display: block; margin: 6px 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  #p2 .fall { width: 100%; height: auto; }
  #p2 .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; }
  #p2 .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  #p2 .legend i { width: 10px; height: 10px; border-radius: 3px; }

  /* 3 · Komuta Merkezi */
  #p3 .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  #p3 .tile { display: grid; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; transition: border-color .16s, background-color .16s; }
  #p3 .tile:hover { border-color: var(--line-strong); background: var(--raised); }
  #p3 .tile header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #p3 .tile strong { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  #p3 .tile svg { width: 100%; height: 42px; }
  #p3 .tile.wide { grid-column: span 2; }
  #p3 .tile.wide svg { height: 96px; }
  #p3 .band { margin-top: 14px; }

  /* 4 · Akış */
  #p4 .sankey { width: 100%; height: auto; }
  #p4 .sankey text { fill: var(--ink); font-size: 13px; }
  #p4 .sankey text.sub { fill: var(--subtle); font-size: 12px; }
  #p4 .sankey path { transition: opacity .16s; }
  #p4 .sankey:hover path { opacity: .25; }
  #p4 .sankey path:hover { opacity: .85; }
  #p4 .foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
  #p4 .foot strong { display: block; margin-top: 4px; font-size: 20px; }

  /* 5 · Anlatı */
  #p5 .story { display: grid; max-width: 1000px; }
  #p5 .chapter { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 30px 0; border-top: 1px solid var(--line); }
  #p5 .chapter:first-child { border-top: 0; padding-top: 6px; }
  #p5 .chapter p { font-size: 19px; line-height: 1.6; color: var(--muted); }
  #p5 .chapter p em { font-style: normal; color: var(--ink); font-weight: 600; }
  #p5 .chapter p em.good { color: var(--ok); }
  #p5 .chapter p em.bad { color: var(--bad); }
  #p5 .chapter svg { width: 100%; height: 130px; }
  #p5 .strip { display: flex; height: 22px; gap: 3px; border-radius: 999px; overflow: hidden; }

  /* 6 · Takvim */
  #p6 .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  #p6 .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  #p6 .cal .dow { color: var(--subtle); font-size: 11px; text-align: center; }
  #p6 .cal .day { position: relative; display: grid; align-content: space-between; aspect-ratio: 1.25; padding: 8px; border-radius: 9px; background: var(--soft); font-size: 11px; outline: 1px solid transparent; transition: outline-color .16s; }
  #p6 .cal .day:hover { outline-color: var(--ink); }
  #p6 .cal .day b { font-size: 12px; font-weight: 600; }
  #p6 .cal .day.empty { background: transparent; }
  #p6 .cal .day.best::after { content: ""; position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  #p6 .scale { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--subtle); font-size: 11px; }
  #p6 .scale i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 12%, var(--soft)), var(--primary)); }
  #p6 .rank { display: grid; gap: 10px; }
  #p6 .rank div { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  #p6 .rank span.bar { height: 8px; border-radius: 4px; background: var(--primary); }
  #p6 .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  #p6 .facts div { padding: 12px 14px; background: var(--soft); border-radius: 12px; }
  #p6 .facts strong { display: block; margin-top: 2px; font-size: 16px; }

  /* 7 · Platformlar */
  #p7 .share { display: flex; height: 14px; gap: 3px; margin: 6px 0 22px; border-radius: 999px; overflow: hidden; }
  #p7 .rows { display: grid; }
  #p7 .row { display: grid; grid-template-columns: 160px minmax(0, 1fr) 120px 90px 110px 140px; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  #p7 .row.head { padding-top: 0; border-top: 0; color: var(--subtle); font-size: 12px; }
  #p7 .row .name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  #p7 .row .name i { width: 10px; height: 10px; border-radius: 3px; }
  #p7 .row .track { height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
  #p7 .row .track span { display: block; height: 100%; border-radius: 5px; }
  #p7 .row > :nth-child(n + 3) { text-align: right; }
  #p7 .row svg { width: 140px; height: 28px; }
  #p7 .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  #p7 .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  #p7 .tiles div { padding: 12px 14px; background: var(--soft); border-radius: 12px; }
  #p7 .tiles strong { display: block; margin: 2px 0; font-size: 18px; }

  /* 8 · Karşılaştırma */
  #p8 .dual { width: 100%; height: 280px; }
  #p8 .bells { display: grid; gap: 26px; padding-top: 10px; }
  #p8 .bell { display: grid; grid-template-columns: 130px minmax(0, 1fr) 96px; align-items: center; gap: 16px; }
  #p8 .bell .track { position: relative; height: 26px; }
  #p8 .bell .track::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--soft); }
  #p8 .bell .link { position: absolute; top: 11px; height: 4px; border-radius: 2px; }
  #p8 .bell .dot { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 3px solid var(--surface); }
  #p8 .bell .dot.prev { background: var(--subtle); }
  #p8 .bell .dot.now { background: var(--primary); }
  #p8 .bell small.v { position: absolute; top: -16px; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  #p8 .layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  #p8 .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--muted); font-size: 12px; }
  #p8 .keys i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; vertical-align: -1px; }
  #p8 .costrow { display: grid; grid-template-columns: 140px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 8px 0; }

  /* 9 · Önce uyarılar */
  #p9 .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  #p9 .health { display: grid; justify-items: center; gap: 10px; text-align: center; }
  #p9 .health .gauge { position: relative; width: 190px; height: 190px; }
  #p9 .health .gauge svg { width: 100%; height: 100%; }
  #p9 .health .gauge div { position: absolute; inset: 0; display: grid; place-content: center; }
  #p9 .health .score { font-size: 44px; font-weight: 700; line-height: 1; }
  #p9 .alerts { display: grid; gap: 10px; }
  #p9 .alert { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto auto; align-items: center; gap: 16px; padding: 14px 16px 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #p9 .alert > i { align-self: stretch; }
  #p9 .alert.bad > i { background: var(--bad); }
  #p9 .alert.warn > i { background: var(--warn); }
  #p9 .alert.ok > i { background: var(--ok); }
  #p9 .alert strong { display: block; font-size: 14px; }
  #p9 .alert .num { font-size: 22px; font-weight: 700; }
  #p9 .alert button { height: 36px; padding: 0 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; transition: background-color .16s, border-color .16s; }
  #p9 .alert button:hover { background: var(--raised); border-color: var(--line-strong); }
  #p9 .mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
  #p9 .mini strong { display: block; margin: 4px 0; font-size: 19px; }

  /* 10 · Tek sayı */
  #p10 .solo { display: grid; justify-items: center; gap: 14px; padding: 48px 20px 36px; text-align: center; }
  #p10 .solo .eyebrow { color: var(--muted); font-size: 13px; }
  #p10 .solo .big { font-size: clamp(48px, 9vw, 104px); font-weight: 700; line-height: 1; letter-spacing: -.035em; color: var(--ok); }
  #p10 .solo .sub { max-width: 56ch; color: var(--muted); font-size: 15px; }
  #p10 .meter { width: min(760px, 100%); margin-top: 18px; }
  #p10 .meter .track { display: flex; height: 18px; gap: 3px; border-radius: 999px; overflow: hidden; }
  #p10 .meter .marks { display: flex; justify-content: space-between; margin-top: 8px; color: var(--subtle); font-size: 12px; }
  #p10 .meter .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 12px; }
  #p10 .meter .keys span { display: inline-flex; align-items: center; gap: 6px; color: var(--subtle); font-size: 12px; }
  #p10 .meter .keys i { width: 8px; height: 8px; border-radius: 2px; }
  #p10 .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 900px; margin: 30px auto 0; border-top: 1px solid var(--line); }
  #p10 .trio div { padding: 22px 16px 0; text-align: center; }
  #p10 .trio div + div { border-left: 1px solid var(--line); }
  #p10 .trio strong { display: block; margin: 6px 0; font-size: 26px; font-weight: 700; }
  #p10 .line { max-width: 900px; margin: 30px auto 0; }
  #p10 .line svg { width: 100%; height: 120px; }

  @media (max-width: 1100px) {
    #p1 .layout, #p6 .layout, #p8 .layout, #p9 .layout { grid-template-columns: minmax(0, 1fr); }
    #p2 .hero, #p3 .grid, #p9 .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #p7 .row { grid-template-columns: 140px minmax(0, 1fr) 110px 80px; }
    #p7 .row > :nth-child(n + 5) { display: none; }
    #p5 .chapter { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  }
  @media (max-width: 760px) {
    main { padding: 20px 16px 48px; }
    .picker { padding: 12px 16px; }
    #p2 .hero, #p3 .grid, #p4 .foot, #p9 .mini, #p6 .facts, #p7 .split { grid-template-columns: minmax(0, 1fr); }
    #p3 .tile.wide { grid-column: auto; }
    #p7 .row { grid-template-columns: 100px minmax(0, 1fr) 96px; gap: 10px; }
    #p7 .row > :nth-child(n + 4) { display: none; }
    #p8 .bell { grid-template-columns: 96px minmax(0, 1fr) 84px; gap: 10px; }
    #p8 .costrow { grid-template-columns: 96px minmax(0, 1fr); }
    #p8 .costrow > :last-child { grid-column: 2; }
    #p9 .alert { grid-template-columns: 6px minmax(0, 1fr) auto; }
    #p9 .alert button { display: none; }
    #p10 .trio { grid-template-columns: minmax(0, 1fr); }
    #p10 .trio div + div { border-left: 0; border-top: 1px solid var(--line); padding-bottom: 18px; }
    #p5 .chapter p { font-size: 17px; }
  }
</style>
</head>
<body>
<header class="picker">
  <div class="picker-head"><h1>Raporlar · Genel Bakış için 10 öneri</h1><p>Hepsi aynı veri: son 30 gün (24.09–23.10.2026), canlıdan yuvarlanmış. ← → tuşlarıyla da geçilir.</p></div>
  <nav aria-label="Öneriler"></nav>
</header>
<main id="stage"></main>
<div class="tip" id="tip" hidden></div>

<script>
// ---------- The figures (last 30 days, as the live report showed them) ----------
const D = {
  period: '24.09.2026 – 23.10.2026',
  sales: 433868.72, net: 401714.71, prevNet: 423475.55,
  orders: 475, prevOrders: 528, basket: 913.41, prevBasket: 919.84, returnRate: 7.0, prevReturnRate: 11.5,
  commissionRate: 21.3,
  costs: [
    { key: 'cost', label: 'Ürün Maliyeti', value: 157505, color: 'var(--c-cost)' },
    { key: 'commission', label: 'Komisyon', value: 85962, color: 'var(--c-commission)' },
    { key: 'cargo', label: 'Kargo', value: 43357, color: 'var(--c-cargo)' },
    { key: 'return', label: 'İade Edilen', value: 32154, color: 'var(--c-return)' },
    { key: 'other', label: 'Diğer Kesintiler', value: 26943, color: 'var(--c-other)' }
  ],
  ops: { cancelRate: 2.7, cancelledOrders: 13, claims: 47, shipHours: 22.9, stockRisk: 9, uninvoiced: 42, repeat: 5.9 },
  platforms: [
    { name: 'Trendyol', orders: 437, share: .931, color: '#f27a1a' },
    { name: 'Hepsiburada', orders: 31, share: .054, color: '#ff6000' },
    { name: 'n11', orders: 4, share: .009, color: '#a855f7' },
    { name: 'PTT AVM', orders: 2, share: .005, color: '#f5c400' },
    { name: 'Pazarama', orders: 1, share: .001, color: '#3b82f6' }
  ],
  products: [
    { name: 'Kadın Siyah Baskılı Simli Yırtmaçlı Likralı Elbise', units: 52, amount: 25597 },
    { name: 'Orta Yaş ve Üzeri Baskı Desenli Simli Likralı Bluz', units: 41, amount: 20362 },
    { name: 'Orta Yaş ve Üzeri Viskon Yapraklı Desen Tunik', units: 25, amount: 18844 },
    { name: 'Orta Yaş ve Üzeri Viskon Şerit Desen Taşlı Bluz', units: 16, amount: 12923 },
    { name: 'Kışlık Saç Örgü Triko Düğmeli Yumuşak Bluz', units: 15, amount: 8626 }
  ]
}
D.costTotal = D.costs.reduce((s, c) => s + c.value, 0)
D.left = D.sales - D.costTotal
const raw = [8482, 25978, 10672, 16303, 16626, 9178, 9599, 15209, 11239, 9698, 11550, 12674, 11995, 15674, 17810, 17201, 9123, 12554, 9494, 12578, 18158, 17250, 15677, 17797, 12042, 23767, 12516, 15373, 21320, 17027]
const rawSum = raw.reduce((s, v) => s + v, 0)
D.days = raw.map((v, i) => ({ date: new Date(2026, 8, 24 + i), value: v / rawSum * D.net }))
const prevRaw = raw.map((v, i) => raw[(i + 11) % 30] * (.9 + ((i * 37) % 10) / 50))
const prevSum = prevRaw.reduce((s, v) => s + v, 0)

D.platforms.forEach(p => { p.amount = p.share * D.net; p.basket = p.amount / p.orders })
const nets = D.days.map(d => d.value)
const rolling = (series, i) => series.slice(Math.max(0, i - 6), i + 1).reduce((s, v) => s + v, 0) / Math.min(i + 1, 7)

// ---------- Formatting ----------
const n = (v, d = 0) => v.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d })
const tl = (v, d = 2) => '₺' + n(v, d)
const tl0 = v => tl(v, 0)
const tlShort = v => v >= 1000 ? '₺' + n(v / 1000, v >= 100000 ? 0 : 1) + ' B' : tl0(v)
const pct = (v, d = 1) => '%' + n(v, d)
const change = (now, before) => (now - before) / before * 100
const delta = (v, invert = false, unit = '%') => {
  const good = (v >= 0) !== invert
  const text = unit === '%' ? `${v >= 0 ? '+' : '−'}%${n(Math.abs(v), 1)}` : `${v >= 0 ? '+' : '−'}${n(Math.abs(v), 1)} puan`
  return `<span class="delta ${good ? 'good' : 'bad'}">${v >= 0 ? '▲' : '▼'} ${text}</span>`
}
const day = d => d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' })
const dayLong = d => d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' })
const share = v => v / D.sales * 100

// ---------- Small chart helpers (inline SVG) ----------
function spark(values, { w = 200, h = 42, color = 'var(--primary)', fill = true } = {}) {
  const max = Math.max(...values), min = Math.min(...values)
  const pts = values.map((v, i) => [i / (values.length - 1) * w, h - 3 - (v - min) / (max - min || 1) * (h - 6)])
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('')
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${fill ? `<path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/>` : ''}<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`
}
function columns(values, { w = 300, h = 120 } = {}) {
  const max = Math.max(...values) * 1.08, bw = w / values.length, best = values.indexOf(Math.max(...values))
  return `<svg viewBox="0 0 ${w} ${h + 18}" style="width:100%;height:auto" role="img" aria-label="Günlük net ciro">
    ${values.map((v, i) => { const bh = v / max * h; return `<rect class="grow" style="animation-delay:${i * 18}ms" data-tip="${dayLong(D.days[i].date)}|${tl0(v)}" x="${i * bw + bw * .15}" y="${h - bh}" width="${bw * .7}" height="${bh}" rx="2" fill="${i === best ? 'var(--primary)' : 'color-mix(in srgb, var(--ink) 20%, transparent)'}"/>` }).join('')}
    ${values.map((_, i) => i % 7 === 0 ? `<text x="${i * bw}" y="${h + 14}" fill="var(--subtle)" font-size="10">${day(D.days[i].date)}</text>` : '').join('')}
  </svg>`
}
function ring(value, { size = 190, stroke = 14, color = 'var(--ok)' } = {}) {
  const r = (size - stroke) / 2
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/><circle pathLength="100" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${value} 100" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`
}
const segments = parts => parts.map((p, i) => `<i class="growx" style="flex:${p.value} 0 0;background:${p.color};animation-delay:${i * 80}ms" data-tip="${p.label}|${tl0(p.value)} · satışın ${pct(share(p.value))}"></i>`).join('')

  { id: 'p7', name: 'Platformlar', title: 'Platformlar: Kim Ne Getirdi', lead: 'Pazaryeri satıcısının ilk sorusu: hangi kanal ne getirdi. Her platform bir satır; payı, cirosu, siparişi, sepeti ve eğrisiyle.', html: () => `<div class="card"><h3>Kanallara Göre Net Ciro<small>${tl0(D.net)}</small></h3>
      <div class="share">${D.platforms.map((p, i) => `<i class="growx" style="flex:${Math.max(p.share, .004)} 0 0;background:${p.color};animation-delay:${i * 80}ms" data-tip="${p.name}|${tl0(p.amount)} · ${pct(p.share * 100)}"></i>`).join('')}</div>
      <div class="rows"><div class="row head"><span>Platform</span><span>Pay</span><span>Net Ciro</span><span>Sipariş</span><span>Ort. Sepet</span><span>30 Gün</span></div>
      ${D.platforms.map((p, i) => `<div class="row"><span class="name"><i style="background:${p.color}"></i>${p.name}</span><span class="track"><span class="growx" style="width:${Math.max(p.share * 100, 1)}%;background:${p.color};animation-delay:${i * 80}ms"></span></span><span><b>${tl0(p.amount)}</b><div class="note">${pct(p.share * 100)}</div></span><span>${n(p.orders)}</span><span>${tl0(p.basket)}</span><span>${spark(nets.map((v, k) => v * p.share * (.7 + ((k * (i + 3)) % 7) / 10)), { w: 140, h: 28, color: p.color, fill: false })}</span></div>`).join('')}</div></div>
      <div class="split"><div class="card"><h3>Dönem Özeti</h3><div class="tiles">${[['Sipariş', n(D.orders), delta(change(D.orders, D.prevOrders))], ['Ortalama Sepet', tl(D.basket), delta(change(D.basket, D.prevBasket))], ['İade Oranı', pct(D.returnRate), delta(D.returnRate - D.prevReturnRate, true, 'puan')], ['Kalan', tl0(D.left), `<span class="note">satışın ${pct(share(D.left))}</span>`]].map(([l, v, d]) => `<div><span class="label">${l}</span><strong>${v}</strong>${d}</div>`).join('')}</div></div>
      <div class="card"><h3>Trendyol Dışı Kanallar<small>${pct((1 - D.platforms[0].share) * 100)} pay</small></h3><p class="note" style="margin-bottom:12px">Satış büyük ölçüde tek kanala bağlı; diğer kanallardaki büyüme burada izlenir.</p>${D.platforms.slice(1).map(p => `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)"><span>${p.name}</span><span>${n(p.orders)} sipariş · ${tl0(p.amount)}</span></div>`).join('')}</div></div>` },
  { id: 'p8', name: 'Karşılaştırma', title: 'Karşılaştırma: Bu Dönem ve Önceki', lead: 'Her şey önceki dönemin yanında: iki çizgili ciro grafiği, her ölçü için önce/şimdi noktaları ve masrafların satışa oranı.', html: () => {
    const w = 760, h = 250, nowW = nets.map((_, i) => rolling(nets, i)), prevW = D.prevDays.map((_, i) => rolling(D.prevDays, i)), max = Math.max(...nowW, ...prevW) * 1.15
    const path = vals => vals.map((v, i) => `${i ? 'L' : 'M'}${(i / 29 * w).toFixed(1)},${(h - v / max * h).toFixed(1)}`).join('')
    const bells = [['Net Ciro', D.prevNet, D.net, tlShort, false], ['Sipariş', D.prevOrders, D.orders, v => n(v), false], ['Ortalama Sepet', D.prevBasket, D.basket, tl0, false], ['İade Oranı', D.prevReturnRate, D.returnRate, v => pct(v), true]]
    return `<div class="layout"><div class="card"><h3>Net Ciro, 7 Günlük Ortalama</h3><div class="keys" style="margin-bottom:10px"><span><i style="background:var(--primary)"></i>Bu dönem ${tl0(D.net)}</span><span><i style="background:var(--subtle)"></i>Önceki ${tl0(D.prevNet)}</span>${delta(change(D.net, D.prevNet))}</div>
      <svg class="dual" viewBox="0 0 ${w} ${h + 20}" preserveAspectRatio="none" role="img" aria-label="Bu dönem ve önceki dönem net ciro"><path d="${path(prevW)}" fill="none" stroke="var(--subtle)" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/><path class="draw" pathLength="1" d="${path(nowW)}" fill="none" stroke="var(--primary)" stroke-width="3" vector-effect="non-scaling-stroke"/></svg></div>
      <div class="card"><h3>Önce → Şimdi</h3><div class="bells">${bells.map(([label, prev, now, f, invert]) => { const lo = Math.min(prev, now) * .85, hi = Math.max(prev, now) * 1.08, x = v => (v - lo) / (hi - lo) * 100, ch = invert ? now - prev : change(now, prev), good = (now >= prev) !== invert; return `<div class="bell"><span class="label">${label}</span><div class="track"><span class="link" style="left:${Math.min(x(prev), x(now))}%;width:${Math.abs(x(now) - x(prev))}%;background:${good ? 'var(--ok)' : 'var(--bad)'}"></span><span class="dot prev" style="left:${x(prev)}%"></span><span class="dot now" style="left:${x(now)}%"></span><small class="v" style="left:${x(now)}%">${f(now)}</small></div>${delta(ch, invert, invert ? 'puan' : '%')}</div>` }).join('')}</div><div class="keys" style="margin-top:18px"><span><i style="background:var(--subtle)"></i>Önceki dönem</span><span><i style="background:var(--primary)"></i>Bu dönem</span></div></div></div>
      <div class="card" style="margin-top:20px"><h3>Masraflar, Satışa Oranla<small>ince çizgi önceki dönem</small></h3>${D.costs.map(c => { const before = share(c.value) * (c.key === 'return' ? 1.55 : 1.02); return `<div class="costrow"><span class="label">${c.label}</span><div style="display:grid;gap:4px"><span class="growx" style="display:block;height:8px;border-radius:4px;width:${share(c.value) * 2.4}%;background:${c.color}"></span><span style="display:block;height:4px;border-radius:2px;width:${before * 2.4}%;background:var(--subtle);opacity:.6"></span></div><span>${pct(share(c.value))} <span class="note">önce ${pct(before)}</span></span></div>` }).join('')}</div>`
  } },
  { id: 'p9', name: 'Önce Uyarılar', title: 'Önce Uyarılar: Bugün Ne Yapmalı', lead: 'Rapor değil iş listesi: dönemin sağlık puanı ve dikkat isteyenler en üstte, her biri kendi düğmesiyle. Ölçüler altta, küçük.', html: () => {
    const score = 74
    const alerts = [
      ['bad', 'İptal oranı eşiğin üstünde', `${D.ops.cancelledOrders} sipariş iptal edildi; eşik %2,0`, pct(D.ops.cancelRate), 'İptalleri Aç'],
      ['warn', 'Faturası kesilmemiş paketler', 'Teslimden 5 gün geçenler öncelikli', n(D.ops.uninvoiced), 'Faturalara Git'],
      ['warn', 'Stoğu bitmek üzere', '7 gün içinde tükenecek ürünler', n(D.ops.stockRisk), 'Ürünleri Gör'],
      ['warn', 'Kargoya verme süresi', 'Siparişten kargoya ortalama', n(D.ops.shipHours, 1) + ' sa', 'Siparişlere Git'],
      ['ok', 'İade oranı düştü', `Önceki dönemde ${pct(D.prevReturnRate)}`, pct(D.returnRate), 'İadeleri Aç']
    ]
    return `<div class="layout"><div class="card health"><h3 style="margin:0">Dönem Sağlığı</h3><div class="gauge">${ring(score, { color: 'var(--warn)' })}<div><span class="score">${score}</span><span class="note">/ 100</span></div></div><p class="note">Ciro geriledi, iadeler iyileşti; iki iş bekliyor.</p></div>
      <div class="alerts">${alerts.map(([tone, title, sub, num, action]) => `<div class="alert ${tone}"><i></i><div><strong>${title}</strong><span class="note">${sub}</span></div><span class="num">${num}</span><button type="button">${action}</button></div>`).join('')}</div></div>
      <div class="mini">${[['Net Ciro', tl0(D.net), delta(change(D.net, D.prevNet))], ['Sipariş', n(D.orders), delta(change(D.orders, D.prevOrders))], ['Ortalama Sepet', tl(D.basket), delta(change(D.basket, D.prevBasket))], ['Kalan', tl0(D.left), `<span class="note">satışın ${pct(share(D.left))}</span>`]].map(([l, v, d]) => `<div class="card"><span class="label">${l}</span><strong>${v}</strong>${d}</div>`).join('')}</div>`
  } },
  { id: 'p10', name: 'Tek Sayı', title: 'Tek Sayı: Elde Kalan', lead: 'Sayfa tek soruya cevap verir: bu dönem elimde ne kaldı. Altında satışın nasıl bölündüğü ve üç destek sayı; ayrıntı sekmelerde.', html: () => `<div class="card"><div class="solo"><span class="eyebrow">Son 30 günde elde kalan (tahmini)</span><span class="big">${tl0(D.left)}</span><p class="sub">${tl0(D.sales)} satıştan ürün maliyeti, komisyon, kargo, iadeler ve kesintiler düşüldükten sonra; satışın ${pct(share(D.left))}'i.</p>
      <div class="meter"><div class="track">${segments(withLeft())}</div><div class="marks"><span>₺0</span><span>Satış ${tl0(D.sales)}</span></div><div class="keys">${withLeft().map(p => `<span><i style="background:${p.color}"></i>${p.label} ${pct(share(p.value))}</span>`).join('')}</div></div></div>
      <div class="trio"><div><span class="label">Net Ciro</span><strong>${tl0(D.net)}</strong>${delta(change(D.net, D.prevNet))}</div><div><span class="label">Sipariş</span><strong>${n(D.orders)}</strong>${delta(change(D.orders, D.prevOrders))}</div><div><span class="label">İade Oranı</span><strong>${pct(D.returnRate)}</strong>${delta(D.returnRate - D.prevReturnRate, true, 'puan')}</div></div>
      <div class="line">${spark(nets.map((_, i) => rolling(nets, i)), { w: 900, h: 120, color: 'var(--ok)' })}<div class="note" style="text-align:center">Net ciro, 7 günlük ortalama · ${D.period}</div></div></div>` }
]

// ---------- Picker, hash and tooltips ----------
const nav = document.querySelector('.picker nav'), stage = document.getElementById('stage'), tip = document.getElementById('tip')
nav.innerHTML = proposals.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="false"><b>${i + 1}</b>${p.name}</button>`).join('')
function show(i) {
  const p = proposals[i]
  stage.innerHTML = `<section class="proposal" id="${p.id}" aria-labelledby="${p.id}-title"><div class="intro"><div><h2 id="${p.id}-title">${i + 1}. ${p.title}</h2><p>${p.lead}</p></div><span class="period">${D.period} · Son 30 Gün</span></div>${p.html()}</section>`
  nav.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)))
  nav.children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' })
  history.replaceState(null, '', '#' + (i + 1))
  tip.hidden = true
}
nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { show(+b.dataset.i); scrollTo({ top: 0 }) } })
addEventListener('keydown', e => { const cur = [...nav.children].findIndex(b => b.getAttribute('aria-pressed') === 'true'); if (e.key === 'ArrowRight') show((cur + 1) % proposals.length); if (e.key === 'ArrowLeft') show((cur + proposals.length - 1) % proposals.length) })
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]')
  if (!t) { tip.hidden = true; return }
  const [head, body] = t.dataset.tip.split('|')
  tip.innerHTML = `<b>${head}</b>${body ?? ''}`
  tip.hidden = false
  const r = tip.getBoundingClientRect()
  tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - r.width - 8)) + 'px'
  tip.style.top = (e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 16) + 'px'
})
show(Math.min(proposals.length - 1, Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1)))
</script>
</body>
</html>
