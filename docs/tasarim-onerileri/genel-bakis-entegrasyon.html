<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entegrasyon Durumu · 15 Öneri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #111115; --surface: #17171c; --raised: #1d1d23; --soft: #22222a;
    --line: #2a2a32; --line-strong: #383842;
    --ink: #ececf0; --muted: #a3a3b0; --subtle: #6f6f7c;
    --primary: #8b5cf6; --primary-soft: #272139;
    --violet: color-mix(in srgb, var(--primary) 55%, white);
    --warn: #e2aa4b; --bad: #e4636f; --ok: #46b98f; --info: #83b4ff;
    --hover: color-mix(in srgb, var(--raised) 60%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { display: grid; gap: 36px; max-width: 1196px; margin: 0 auto; padding: 32px 24px 96px; }
  .head h1 { font-size: 18px; font-weight: 600; } .head p { margin-top: 2px; color: var(--muted); font-size: 13px; } .head .crumb { color: var(--subtle); font-size: 12px; font-weight: 500; }
  .opt { display: grid; gap: 12px; }
  .opt > header h2 { font-size: 15px; font-weight: 600; } .opt > header p { margin-top: 2px; color: var(--muted); font-size: 13px; max-width: 92ch; }
  .card { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .ch { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px; }
  .ch h3 { font-size: 16px; font-weight: 600; } .ch p { color: var(--muted); font-size: 13px; }
  .cb { padding: 0 16px 16px; display: grid; gap: 12px; min-width: 0; }
  .bt { border-top: 1px solid var(--line); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; }
  .dot { display: inline-block; width: 8px; height: 8px; flex: none; border-radius: 50%; }
  .ok { --c: var(--ok); } .warn { --c: var(--warn); } .bad { --c: var(--bad); } .off { --c: var(--subtle); } .info { --c: var(--info); }
  .dot, .pill i { background: var(--c, var(--subtle)); }
  .logo { width: 26px; height: 26px; flex: none; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
  .logo.sm { width: 20px; height: 20px; border-radius: 5px; font-size: 9px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 10px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .btn:hover { background: var(--hover); } .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--violet); font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .link svg, .btn svg { width: 14px; height: 14px; }
  .muted { color: var(--muted); } .subtle { color: var(--subtle); font-size: 12px; }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.t th { padding: 9px 12px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; background: var(--raised); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; } table.t tr:hover td { background: var(--hover); }
  .nm { display: flex; align-items: center; gap: 10px; } .nm b { font-weight: 500; } .nm small { display: block; color: var(--subtle); font-size: 12px; }
  .cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--violet)); }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tag.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line-strong)); } .tag.offw { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line-strong)); }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .g2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  .tw { overflow-x: auto; }
  @media (max-width: 1100px) { .g3 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .wrap { padding: 16px 16px 96px; } .g3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const ico = p => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`
const I = { arrow: ico('<path d="M3 8h10M9 4l4 4-4 4"/>'), refresh: ico('<path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 2.5v3h-3"/>'), alert: ico('<path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.5h.01"/>'), clock: ico('<circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2 1.3"/>'), check: ico('<path d="m3.5 8.3 2.9 2.9 6.1-6.4"/>'), key: ico('<circle cx="5.5" cy="10.5" r="3"/><path d="M7.6 8.4 13.5 2.5M11 5l1.8 1.8"/>'), lock: ico('<rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'), queue: ico('<path d="M3 4h10M3 8h10M3 12h6"/>'), hook: ico('<path d="M6 4a2 2 0 1 1 3.5 1.3L7 9"/><circle cx="4.5" cy="11" r="2"/><circle cx="11.5" cy="11" r="2"/><path d="M6.5 11h3M9 9l1.6 1"/>'), scale: ico('<path d="M8 2.5v11M4 13.5h8M3 5h10M3 5l-1.5 4h3zM13 5l-1.5 4h3z"/>'), gauge: ico('<path d="M2.5 11a5.5 5.5 0 0 1 11 0"/><path d="m8 11 2.5-3"/>'), play: ico('<path d="M5 3.5v9l7-4.5z"/>') }
// connections of the panel and their state over the last 24 hours (sample)
const C = [
  { n: 'Trendyol', s: 'Mağaza 1188201', c: '#f27a1a', l: 'T', st: 'ok', last: '2 dk', q: 0, fail: 0, rate: 31, write: true, score: 99, stock: 0, data: { Sipariş: ['ok', '2 dk'], Ürün: ['ok', '1 sa'], Stok: ['ok', '6 dk'], Fiyat: ['ok', '6 dk'], İade: ['ok', '4 dk'], Fatura: ['ok', '12 dk'] } },
  { n: 'Hepsiburada', s: 'Mağaza 77120', c: '#ff6000', l: 'H', st: 'warn', last: '4 dk', q: 3, fail: 1, rate: 74, write: true, score: 88, stock: 2, data: { Sipariş: ['ok', '4 dk'], Ürün: ['ok', '2 sa'], Stok: ['warn', '48 dk'], Fiyat: ['ok', '9 dk'], İade: ['ok', '7 dk'], Fatura: ['bad', '3 sa'] } },
  { n: 'N11', s: 'ravencia', c: '#7c5cff', l: 'n', st: 'ok', last: '6 dk', q: 0, fail: 0, rate: 12, write: false, score: 95, stock: 0, data: { Sipariş: ['ok', '6 dk'], Ürün: ['ok', '3 sa'], Stok: ['ok', '15 dk'], Fiyat: ['ok', '15 dk'], İade: ['ok', '11 dk'], Fatura: ['off', '—'] } },
  { n: 'Pazarama', s: 'Mağaza 5501', c: '#2f9bd8', l: 'P', st: 'ok', last: '9 dk', q: 0, fail: 0, rate: 8, write: true, score: 97, stock: 0, data: { Sipariş: ['ok', '9 dk'], Ürün: ['ok', '5 sa'], Stok: ['ok', '20 dk'], Fiyat: ['ok', '20 dk'], İade: ['ok', '16 dk'], Fatura: ['off', '—'] } },
  { n: 'Shopify', s: 'ravencia.myshopify.com', c: '#5e8e3e', l: 'S', st: 'bad', last: '2 sa', q: 1, fail: 1, rate: 5, write: true, score: 61, stock: 5, data: { Sipariş: ['bad', '2 sa'], Ürün: ['ok', '1 sa'], Stok: ['warn', '1 sa'], Fiyat: ['ok', '1 sa'], İade: ['off', '—'], Fatura: ['off', '—'] } },
]
const ST = { ok: 'Çalışıyor', warn: 'Gecikiyor', bad: 'Hata Var', off: 'Kapsam Dışı' }
const logo = (c, sm) => `<span class="logo ${sm ? 'sm' : ''}" style="background:${c.c}">${c.l}</span>`
const pill = issues => issues ? `<span class="pill warn"><i></i>${issues} konu dikkatinizi bekliyor</span>` : `<span class="pill ok"><i></i>Her şey yolunda</span>`
const head = (t, d, right = pill(2)) => `<div class="ch"><div><h3>${t}</h3><p>${d}</p></div>${right}</div>`
const opts = []
const add = (n, t, d, html) => opts.push(`<section class="opt"><header><h2>Öneri ${n} · ${t}</h2><p>${d}</p></header>${html}</section>`)
const KEYS = ['Sipariş', 'Ürün', 'Stok', 'Fiyat', 'İade', 'Fatura']

add(1, 'Bağlantı × Veri Matrisi', 'Her pazar yeri bir satır, her veri türü bir sütun; hücrede son eşitlemenin yaşı ve rengi. Sorunun hangi pazar yerinde ve hangi veride olduğu tek bakışta görülür.',
  `<article class="card">${head('Entegrasyon Durumu', 'Pazar yeri ve veri türüne göre son eşitleme')}<div class="tw"><table class="t"><thead><tr><th>Pazar Yeri</th>${KEYS.map(k => `<th>${k}</th>`).join('')}<th></th></tr></thead><tbody>${C.map(c => `<tr><td><span class="nm">${logo(c)}<span><b>${c.n}</b><small>${c.s}</small></span></span></td>${KEYS.map(k => { const [s, a] = c.data[k]; return `<td><span class="cell ${s}" title="${ST[s]}"><i class="dot"></i><span class="${s === 'off' ? 'subtle' : 'num'}" style="${s === 'bad' ? 'color:var(--bad)' : s === 'warn' ? 'color:var(--warn)' : ''}">${s === 'off' ? 'Yok' : a + (a === '—' ? '' : ' önce')}</span></span></td>` }).join('')}<td style="text-align:right">${c.st !== 'ok' ? `<a class="link" href="#">İncele ${I.arrow}</a>` : ''}</td></tr>`).join('')}</tbody></table></div></article>`)

add(2, 'Pazar Yeri Kartları', 'Her bağlantı kendi kartında: durum, son veri, kuyruk, hata, hız sınırı ve dış yazma anahtarı. Sorunlu kart renkli kenarla öne çıkar.',
  `<article class="card">${head('Entegrasyon Durumu', 'Bağlantı bağlantı son 24 saat')}<div class="cb"><div class="g3">${C.map(c => `<div style="display:grid;gap:10px;padding:14px;border:1px solid ${c.st === 'ok' ? 'var(--line)' : `color-mix(in srgb, var(--${c.st === 'bad' ? 'bad' : 'warn'}) 45%, var(--line))`};border-radius:12px;background:var(--raised)"><div class="nm">${logo(c)}<span style="flex:1;min-width:0"><b>${c.n}</b><small>${c.s}</small></span><span class="pill ${c.st}"><i></i>${ST[c.st]}</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px"><span><span class="subtle">Son Veri</span><br><b class="num">${c.last} önce</b></span><span><span class="subtle">Kuyruk</span><br><b class="num">${c.q}</b></span><span><span class="subtle">Hata</span><br><b class="num" style="${c.fail ? 'color:var(--bad)' : ''}">${c.fail}</b></span></div><div style="display:grid;gap:4px;font-size:12px"><span style="display:flex;justify-content:space-between"><span class="subtle">Hız Sınırı Kullanımı</span><b class="num">%${c.rate}</b></span><span class="bar ${c.rate > 70 ? 'warn' : 'ok'}"><b style="width:${c.rate}%"></b></span></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="tag ${c.write ? 'on' : 'offw'}">${c.write ? 'Dış Yazma Açık' : 'Dış Yazma Kapalı'}</span><a class="link" href="#">Bağlantı ${I.arrow}</a></div></div>`).join('')}</div></div></article>`)

add(3, 'Önce Yapılacaklar', 'Sorunlar önem sırasına göre liste halinde, her birinin yanında çözüm düğmesi. Sorunsuz bağlantılar altta tek satır rozetlerle; dikkat gerektirmeyen bilgi yer kaplamaz.',
  `<article class="card">${head('Entegrasyon Durumu', 'Çözülmesi gerekenler önde')}<div class="cb">${[['bad', 'Shopify siparişleri 2 saattir gelmiyor', 'Bağlantı anahtarı reddedildi (401). Yeni erişim anahtarı girilmesi gerekiyor.', 'Anahtarı Yenile'], ['bad', 'Hepsiburada · 1 fatura iletilemedi', '#4736002251 · Belge numarası geçersiz; fatura yeniden kesilmeli.', 'Faturaya Git'], ['warn', 'Hepsiburada stok eşitlemesi gecikiyor', 'Son başarılı stok gönderimi 48 dk önce; 3 iş kuyrukta bekliyor.', 'Kuyruğu Gör'], ['warn', '1 iade kararınızı bekliyor', 'Trendyol #11700659629 · otomatik onaya 1 gün 6 saat kaldı.', 'Karar Ver']].map(([s, t, d, a]) => `<div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--raised)"><span style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--${s});background:color-mix(in srgb, var(--${s}) 12%, var(--surface))">${s === 'bad' ? I.alert : I.clock}</span><span><b style="font-weight:600">${t}</b><br><span class="muted" style="font-size:12.5px">${d}</span></span><button class="btn ${s === 'bad' ? 'primary' : ''}">${a}</button></div>`).join('')}<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:4px"><span class="subtle">Sorunsuz:</span>${C.filter(c => c.st === 'ok').map(c => `<span class="pill ok">${logo(c, true)}${c.n} · ${c.last} önce</span>`).join('')}</div></div></article>`)

add(4, '24 Saatlik Zaman Çizelgesi', 'Her bağlantı için 24 saatlik şerit: eşitlemeler ince çizgi, hatalar kırmızı, gecikmeler sarı. Sorunun ne zaman başladığı ve sürüp sürmediği görülür.',
  `<article class="card">${head('Entegrasyon Durumu', 'Son 24 saatteki eşitlemeler')}<div class="cb">${C.map((c, k) => `<div style="display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:13px"><span class="nm">${logo(c, true)}<b>${c.n}</b></span><span style="position:relative;height:26px;border-radius:6px;background:var(--raised);overflow:hidden">${Array.from({ length: 96 }, (_, i) => { const bad = c.st === 'bad' && i > 88, warn = c.st === 'warn' && i > 80 && i % 3 === 0; return `<i style="position:absolute;left:${i / 96 * 100}%;top:5px;bottom:5px;width:2px;border-radius:1px;background:${bad ? 'var(--bad)' : warn ? 'var(--warn)' : 'color-mix(in srgb, var(--ok) 55%, transparent)'};${(i + k) % 4 && !bad ? 'opacity:.35' : ''}"></i>` }).join('')}</span><span class="num subtle" style="text-align:right">${c.last} önce</span></div>`).join('')}<div style="display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:12px"><span></span><span style="display:flex;justify-content:space-between" class="subtle"><span>Dün 17:00</span><span>23:00</span><span>05:00</span><span>11:00</span><span>Şimdi</span></span><span></span></div></div></article>`)

add(5, 'İş Akışı', 'Pazar yerinden gelen işin yolculuğu tek şeritte: alındı → sırada → işleniyor → tamamlandı / tamamlanamadı. Darboğaz nerede ise o kutu öne çıkar.',
  `<article class="card">${head('Entegrasyon Durumu', 'Son 24 saatte işlenen işler')}<div class="cb"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;align-items:stretch">${[['Pazar Yerinden Alındı', '18.240', 'istek', 'info'], ['Sırada', '4', 'en eskisi 3 dk', 'warn'], ['İşleniyor', '2', 'şu anda', 'info'], ['Tamamlandı', '18.232', '%99,96', 'ok'], ['Tamamlanamadı', '2', 'tekrar bekliyor', 'bad']].map(([t, v, s, c], i) => `<div style="position:relative;display:grid;gap:2px;padding:14px 16px 14px ${i ? 24 : 16}px;background:var(--raised);border:1px solid var(--line);${i ? 'border-left:0;' : 'border-radius:10px 0 0 10px;'}${i === 4 ? 'border-radius:0 10px 10px 0;' : ''}"><span class="subtle">${t}</span><strong class="num" style="font-size:22px;font-weight:600;color:${c === 'bad' ? 'var(--bad)' : c === 'warn' ? 'var(--warn)' : 'var(--ink)'}">${v}</strong><span class="subtle">${s}</span>${i < 4 ? `<span style="position:absolute;right:-9px;top:50%;z-index:1;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);transform:translateY(-50%)"><svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 4 4 4-4 4"/></svg></span>` : ''}</div>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px" class="muted"><span>Ortalama işlem süresi <b class="num" style="color:var(--ink)">1,4 sn</b></span><span>En yavaş: <b style="color:var(--ink)">Hepsiburada stok</b> · 6,2 sn</span><a class="link" href="#">İşlem Takibi ${I.arrow}</a></div></div></article>`)

add(6, 'Sağlık Puanı', 'Tüm entegrasyon için tek puan; altında puanı düşüren etkenler ve her bağlantının kendi puanı. Yöneticinin "her şey yolunda mı?" sorusuna tek sayıyla yanıt.',
  `<article class="card">${head('Entegrasyon Durumu', 'Son 24 saatin sağlık puanı')}<div class="cb g2" style="align-items:center"><div style="display:flex;align-items:center;gap:20px"><div style="position:relative;width:120px;height:120px;flex:none"><svg viewBox="0 0 120 120" style="width:120px;height:120px;transform:rotate(-90deg)"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line-strong)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="88 100"/></svg><span style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><span><strong class="num" style="font-size:30px;font-weight:600;line-height:1">88</strong><br><span class="subtle">/ 100</span></span></span></div><div style="display:grid;gap:6px;font-size:13px"><b style="font-size:15px">İyi, iki konu puanı düşürüyor</b>${[['Shopify sipariş eşitlemesi durdu', '−8'], ['Hepsiburada fatura iletimi', '−3'], ['Hepsiburada stok gecikmesi', '−1']].map(([t, v]) => `<span style="display:flex;justify-content:space-between;gap:16px"><span class="muted">${t}</span><b class="num" style="color:var(--bad)">${v}</b></span>`).join('')}</div></div><div class="rows" style="display:grid;gap:8px">${C.map(c => `<div style="display:grid;grid-template-columns:auto 110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px">${logo(c, true)}<b style="font-weight:500">${c.n}</b><span class="bar ${c.score > 90 ? 'ok' : c.score > 75 ? 'warn' : 'bad'}"><b style="width:${c.score}%"></b></span><b class="num" style="text-align:right">${c.score}</b></div>`).join('')}</div></div></article>`)

add(7, 'Veri Tazeliği', 'Her veri türü için "en geç ne zaman güncellendi" çubuğu ve kabul edilen süre çizgisi. Stok 30 dakikayı, sipariş 15 dakikayı aşınca uyarır.',
  `<article class="card">${head('Veri Tazeliği', 'En eski güncelleme, kabul edilen süreye göre')}<div class="cb">${[['Sipariş', 120, 15, 'Shopify'], ['Stok', 60, 30, 'Shopify'], ['Fiyat', 60, 30, 'Shopify'], ['İade', 16, 30, 'Pazarama'], ['Fatura', 180, 60, 'Hepsiburada'], ['Ürün', 300, 720, 'Pazarama']].map(([k, age, sla, who]) => { const pct = Math.min(100, age / (sla * 2) * 100), s = age > sla * 2 ? 'bad' : age > sla ? 'warn' : 'ok'; return `<div style="display:grid;grid-template-columns:70px minmax(0,1fr) 190px;gap:12px;align-items:center;font-size:13px"><b style="font-weight:500">${k}</b><span style="position:relative"><span class="bar ${s}" style="height:8px"><b style="width:${pct}%"></b></span><i style="position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--line-strong)" title="Kabul edilen süre ${sla} dk"></i></span><span class="muted" style="text-align:right">${age >= 60 ? Math.round(age / 60) + ' sa' : age + ' dk'} önce · <span style="color:var(--${s === 'ok' ? 'muted' : s})">${who}</span></span></div>` }).join('')}<span class="subtle">Dikey çizgi kabul edilen süreyi gösterir. Çizgiyi geçen veri türü sarı, iki katını geçen kırmızı olur.</span></div></article>`)

add(8, 'Hız Sınırı Göstergeleri', 'Pazar yerlerinin istek sınırına ne kadar yaklaşıldığı; sınıra takılan istekler ve bir sonraki pencereye kalan süre. Yoğun kampanya günlerinde işin neden yavaşladığını açıklar.',
  `<article class="card">${head('Pazar Yeri Hız Sınırları', 'Son 1 saatlik istek kullanımı')}<div class="cb"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px" class="g5">${C.map(c => { const s = c.rate > 70 ? 'warn' : 'ok'; return `<div style="display:grid;justify-items:center;gap:6px;padding:14px 8px;background:var(--raised);border:1px solid var(--line);border-radius:10px;text-align:center"><svg viewBox="0 0 120 70" width="120" height="70"><path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="var(--line-strong)" stroke-width="10" stroke-linecap="round"/><path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="var(--${s})" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="${c.rate} 100"/><text x="60" y="60" text-anchor="middle" fill="var(--ink)" font-size="18" font-weight="600" font-family="Inter">%${c.rate}</text></svg><span class="nm" style="justify-content:center">${logo(c, true)}<b>${c.n}</b></span><span class="subtle">${c.rate > 70 ? '12 istek sınıra takıldı' : 'Sınıra takılan yok'}</span></div>` }).join('')}</div></div><style>@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))!important}}</style></article>`)

add(9, 'Stok Uyumu', 'Panel stoğu ile pazar yerindeki stok karşılaştırması: kaç üründe fark var, fark ne zamandır sürüyor, tek tıkla düzeltme. Satış kaçırmayı ve fazla satışı önler.',
  `<article class="card">${head('Stok Karşılaştırması', 'Son karşılaştırma 1 saat önce', `<button class="btn">${I.refresh}Şimdi Karşılaştır</button>`)}<div class="tw"><table class="t"><thead><tr><th>Pazar Yeri</th><th>Karşılaştırılan</th><th>Farklı</th><th>En Büyük Fark</th><th>Durum</th><th></th></tr></thead><tbody>${C.map(c => `<tr><td><span class="nm">${logo(c, true)}<b>${c.n}</b></span></td><td class="num">${[1240, 1186, 612, 340, 412][C.indexOf(c)].toLocaleString('tr-TR')} ürün</td><td class="num" style="${c.stock ? 'color:var(--warn);font-weight:600' : ''}">${c.stock}</td><td class="num muted">${c.stock ? `RYP00103 · panel 3, pazar yeri ${c.stock + 4}` : '—'}</td><td><span class="cell ${c.stock ? 'warn' : 'ok'}"><i class="dot"></i>${c.stock ? 'Fark Var' : 'Eşleşiyor'}</span></td><td style="text-align:right">${c.stock ? `<button class="btn">Farkları Gönder</button>` : ''}</td></tr>`).join('')}</tbody></table></div></article>`)

add(10, 'Tek Satır Durum Şeridi', 'Genel Bakış’ta yalnızca bir satır: her pazar yeri logosu ve durum noktası, sağda tek özet. Ayrıntı satıra tıklanınca açılır; sorun yokken sayfada yer kaplamaz.',
  `<article class="card"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 16px"><b style="font-size:15px">Entegrasyon</b>${C.map(c => `<span class="nm" title="${ST[c.st]} · ${c.last} önce" style="gap:6px;font-size:13px">${logo(c, true)}<span>${c.n}</span><i class="dot ${c.st}"></i></span>`).join('')}<span style="margin-left:auto;display:flex;align-items:center;gap:12px">${pill(2)}<button class="btn">Ayrıntılar ${ico('<path d="m4.5 6 3.5 3.5L11.5 6"/>')}</button></span></div></article><article class="card"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 16px"><b style="font-size:15px">Entegrasyon</b>${C.map(c => `<span class="nm" style="gap:6px;font-size:13px">${logo(c, true)}<span>${c.n}</span><i class="dot ok"></i></span>`).join('')}<span style="margin-left:auto">${pill(0)}</span></div></article>`)

add(11, 'Olay Akışı', 'Son 24 saatte olan önemli olaylar zaman sırasıyla: eşitleme başladı/bitti, hata, düzeldi, karar bekliyor. Neyin ne zaman olduğunu anlatır; filtreyle yalnız hatalar seçilir.',
  `<article class="card">${head('Entegrasyon Olayları', 'Son 24 saat', `<div style="display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line-strong);border-radius:9px">${['Tümü', 'Hatalar', 'Kararlar'].map((t, i) => `<button class="btn" style="height:26px;${i ? 'border-color:transparent;background:none;color:var(--muted)' : 'background:var(--raised)'}">${t}</button>`).join('')}</div>`)}<div class="cb" style="gap:0">${[['bad', '17:42', 'Shopify', 'Sipariş eşitlemesi durdu', 'Bağlantı anahtarı reddedildi (401).'], ['warn', '17:10', 'Hepsiburada', 'Stok gönderimi gecikti', '3 iş kuyrukta, en eskisi 48 dk.'], ['ok', '16:55', 'Trendyol', '42 yeni sipariş alındı', 'Tek eşitlemede 42 sipariş, 0 hata.'], ['bad', '15:20', 'Hepsiburada', 'Fatura iletilemedi', '#4736002251 · belge numarası geçersiz.'], ['ok', '14:02', 'N11', 'Bağlantı yeniden kuruldu', '6 dakikalık kesinti kendiliğinden düzeldi.'], ['info', '11:30', 'Trendyol', 'İade kararınızı bekliyor', '#11700659629 · otomatik onaya 1 gün kaldı.']].map(([s, t, p, h, d], i, a) => `<div style="display:grid;grid-template-columns:46px 18px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13px"><span class="num subtle" style="padding-top:10px">${t}</span><span style="position:relative;display:grid;justify-items:center;height:100%"><i class="dot ${s}" style="margin-top:14px;box-shadow:0 0 0 3px var(--surface)"></i>${i < a.length - 1 ? '<i style="position:absolute;top:24px;bottom:0;width:1px;background:var(--line)"></i>' : ''}</span><span style="padding:8px 0 12px"><b style="font-weight:500">${h}</b> <span class="subtle">· ${p}</span><br><span class="muted" style="font-size:12.5px">${d}</span></span>${s === 'bad' ? '<a class="link" href="#" style="padding-top:10px">İncele</a>' : '<span></span>'}</div>`).join('')}</div></article>`)

add(12, 'Bağlantı Tablosu', 'Tüm bağlantılar tek tabloda: durum, son veri, kuyruk, hata, hız sınırı, dış yazma ve hızlı işlem. Entegrasyon sayfasına gitmeden en sık işler yapılır.',
  `<article class="card">${head('Entegrasyon Durumu', 'Bağlantılar ve son 24 saat')}<div class="tw"><table class="t"><thead><tr><th>Bağlantı</th><th>Durum</th><th>Son Veri</th><th>Kuyruk</th><th>Hata</th><th>Hız Sınırı</th><th>Dış Yazma</th><th></th></tr></thead><tbody>${C.map(c => `<tr><td><span class="nm">${logo(c)}<span><b>${c.n}</b><small>${c.s}</small></span></span></td><td><span class="cell ${c.st}"><i class="dot"></i>${ST[c.st]}</span></td><td class="num">${c.last} önce</td><td class="num">${c.q}</td><td class="num" style="${c.fail ? 'color:var(--bad);font-weight:600' : ''}">${c.fail}</td><td style="min-width:110px"><span style="display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:8px;align-items:center"><span class="bar ${c.rate > 70 ? 'warn' : 'ok'}"><b style="width:${c.rate}%"></b></span><span class="num subtle">%${c.rate}</span></span></td><td><span class="tag ${c.write ? 'on' : 'offw'}">${c.write ? 'Açık' : 'Kapalı'}</span></td><td style="text-align:right"><button class="btn">${I.refresh}Eşitle</button></td></tr>`).join('')}</tbody></table></div></article>`)

add(13, 'Hatalar Nedenine Göre', 'Tamamlanamayan işler nedenine göre gruplanmış: kaç iş, hangi pazar yeri, ne yapılmalı. Aynı hatayı tek tek değil, toplu çözmeye götürür.',
  `<article class="card">${head('Tamamlanamayan İşler', 'Son 24 saat · nedenine göre', pill(2))}<div class="cb">${[['Bağlantı anahtarı reddedildi', 'Shopify', 14, 'Anahtar yenilenene kadar sipariş ve stok işleri durur.', 'Anahtarı Yenile', 'bad'], ['Fatura belge numarası geçersiz', 'Hepsiburada', 1, 'Fatura yeniden kesilip iletilmeli.', 'Faturaya Git', 'bad'], ['Pazar yeri hız sınırı', 'Hepsiburada', 12, 'Kendiliğinden tekrar denenir; işlem gerekmez.', 'Ayrıntı', 'warn'], ['Eşleşmeyen barkod', 'Trendyol', 3, 'Ürün eşleştirmesi yapılınca stok gönderilir.', 'Eşleştir', 'warn']].map(([t, p, n, d, a, s]) => `<div style="display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px"><span style="display:grid;place-items:center;height:42px;border-radius:9px;background:color-mix(in srgb, var(--${s}) 12%, var(--surface));color:var(--${s});font-size:18px;font-weight:600" class="num">${n}</span><span><b style="font-weight:600">${t}</b> <span class="subtle">· ${p}</span><br><span class="muted" style="font-size:12.5px">${d}</span></span><button class="btn ${s === 'bad' ? 'primary' : ''}">${a}</button></div>`).join('')}</div></article>`)

add(14, 'Erişim ve Güvenlik', 'Bağlantıların erişim tarafı: anahtar geçerliliği ve süresi, verilen yetkiler, webhook durumu, dış yazma anahtarı. Bağlantı kopmadan önce uyarır.',
  `<article class="card">${head('Erişim ve Yetkiler', 'Anahtarlar, yetkiler ve bildirim kancaları', pill(1))}<div class="cb"><div class="g3">${C.map(c => { const exp = { Trendyol: 'Süresiz', Hepsiburada: 'Süresiz', N11: 'Süresiz', Pazarama: '41 gün kaldı', Shopify: 'Reddedildi' }[c.n]; const bad = exp === 'Reddedildi'; return `<div style="display:grid;gap:8px;padding:12px 14px;border:1px solid ${bad ? 'color-mix(in srgb, var(--bad) 45%, var(--line))' : 'var(--line)'};border-radius:10px;background:var(--raised);font-size:12.5px"><span class="nm">${logo(c, true)}<b style="flex:1">${c.n}</b><span class="tag ${c.write ? 'on' : 'offw'}">${c.write ? 'Dış Yazma Açık' : 'Dış Yazma Kapalı'}</span></span><span style="display:flex;justify-content:space-between"><span class="muted cell">${I.key}Anahtar</span><b style="color:${bad ? 'var(--bad)' : exp.includes('gün') ? 'var(--warn)' : 'var(--ink)'}">${exp}</b></span><span style="display:flex;justify-content:space-between"><span class="muted cell">${I.lock}Yetkiler</span><b>${c.n === 'Shopify' ? 'Sipariş, Ürün' : 'Sipariş, Ürün, Stok, Fiyat, İade'}</b></span><span style="display:flex;justify-content:space-between"><span class="muted cell">${I.hook}Bildirim Kancası</span><b style="color:${c.n === 'Shopify' ? 'var(--bad)' : 'var(--ok)'}">${c.n === 'Shopify' ? 'Yanıt Yok' : 'Çalışıyor'}</b></span></div>` }).join('')}</div></div></article>`)

add(15, 'Durum ve Kuyruk Yan Yana', 'Solda pazar yerleri ve durumları, sağda sıradaki işlerin ilerlemesi ve tahmini bitiş. "Bağlantılar sağlam mı" ve "işler ne zaman biter" aynı kartta.',
  `<article class="card">${head('Entegrasyon Durumu', 'Bağlantılar ve sıradaki işler')}<div class="cb g2"><div style="display:grid;gap:6px">${C.map(c => `<div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--raised);font-size:13px">${logo(c)}<span><b style="font-weight:500">${c.n}</b><br><span class="subtle">${c.last} önce · ${c.fail ? `<span style="color:var(--bad)">${c.fail} hata</span>` : 'hata yok'}</span></span><span class="cell ${c.st}"><i class="dot"></i>${ST[c.st]}</span></div>`).join('')}</div><div style="display:grid;align-content:start;gap:10px;padding-left:16px;border-left:1px solid var(--line)"><div style="display:flex;align-items:baseline;justify-content:space-between"><b>Sıradaki İşler</b><span class="subtle">tahmini bitiş 2 dk</span></div>${[['Hepsiburada · Stok gönderimi', 3, 1, 'warn'], ['Trendyol · Fiyat güncelleme', 120, 96, 'info'], ['Shopify · Sipariş eşitleme', 1, 0, 'bad'], ['N11 · Ürün aktarımı', 640, 412, 'info']].map(([t, total, done, s]) => `<div style="display:grid;gap:4px;font-size:12.5px"><span style="display:flex;justify-content:space-between;gap:8px"><span>${t}</span><span class="num subtle">${done}/${total}</span></span><span class="bar ${s}"><b style="width:${Math.max(4, done / total * 100)}%"></b></span>${s === 'bad' ? '<span style="color:var(--bad);font-size:12px">Durdu · bağlantı anahtarı gerekiyor</span>' : ''}</div>`).join('')}<a class="link" href="#">İşlem Takibi ${I.arrow}</a></div></div></article>`)

document.getElementById('root').innerHTML = `<header class="head"><div class="crumb">Genel Bakış</div><h1>Entegrasyon Durumu · 15 Öneri</h1><p>Pazar yeri bağlantılarının sağlığını daha verimli gösteren yerleşimler: sorun nerede, ne zamandan beri, ne yapmalı. Veriler örnektir.</p></header>${opts.join('')}`
</script>
</body>
</html>
