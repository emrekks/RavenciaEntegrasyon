<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Sekmeleri · 6 Öneri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #111115; --surface: #17171c; --raised: #1d1d23; --soft: #22222a;
    --line: #2a2a32; --line-strong: #383842;
    --ink: #ececf0; --muted: #a3a3b0; --subtle: #6f6f7c;
    --primary: #8b5cf6; --primary-soft: #272139;
    --violet: color-mix(in srgb, var(--primary) 55%, white);
    --warn: #e2aa4b; --bad: #e4636f; --ok: #46b98f; --info: #83b4ff;
    --hover: color-mix(in srgb, var(--raised) 60%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { display: grid; gap: 36px; max-width: 1196px; margin: 0 auto; padding: 32px 24px 96px; }
  .head h1 { font-size: 18px; font-weight: 600; } .head p { margin-top: 2px; color: var(--muted); font-size: 13px; } .head .crumb { color: var(--subtle); font-size: 12px; font-weight: 500; }
  .opt { display: grid; gap: 12px; }
  .opt > header h2 { font-size: 15px; font-weight: 600; } .opt > header p { margin-top: 2px; color: var(--muted); font-size: 13px; max-width: 90ch; }
  .card { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .ch { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; padding: 16px 16px 0; }
  .ch h3 { font-size: 16px; font-weight: 600; } .ch p { color: var(--muted); font-size: 13px; }
  .cb { padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .sel { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; font-size: 13px; cursor: pointer; }
  .sel svg { width: 14px; height: 14px; color: var(--muted); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px; }
  .seg button { height: 28px; padding: 0 10px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .seg button.on { color: var(--ink); background: var(--raised); border-color: var(--line-strong); }
  .total small { display: block; color: var(--muted); font-size: 13px; } .total strong { font-size: 26px; font-weight: 600; line-height: 1.25; }
  .trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; } .trend em { color: var(--subtle); font-style: normal; font-weight: 400; }
  .trend.up { color: var(--ok); } .trend.down { color: var(--bad); }
  .trend svg { width: 12px; height: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12.5px; } .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 3px; }
  .legend .ln { width: 16px; height: 0; border-radius: 0; border-top: 2px solid var(--violet); } .legend .dash { border-top: 2px dashed var(--subtle); }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { fill: var(--subtle); font-size: 11px; font-family: inherit; }
  svg.chart .g { stroke: var(--line); }
  .logo { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--violet); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .link svg { width: 14px; height: 14px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; }
  .rows { display: grid; gap: 8px; }
  .chrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
  .chrow .t { display: grid; gap: 4px; min-width: 0; } .chrow .t > span { display: flex; justify-content: space-between; gap: 8px; } .chrow .t small { color: var(--subtle); font-size: 12px; }
  .bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; border-radius: 3px; }
  .pct { font-weight: 600; } .delta { font-size: 12px; font-weight: 600; } .delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .kpi { display: grid; gap: 1px; padding: 12px 16px; text-align: left; color: var(--ink); background: none; border: 0; border-right: 1px solid var(--line); font: inherit; cursor: pointer; position: relative; }
  .kpi:last-child { border-right: 0; } .kpi:hover { background: var(--hover); }
  .kpi small { color: var(--muted); font-size: 12.5px; } .kpi strong { font-size: 18px; font-weight: 600; }
  .kpi.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.t th { padding: 9px 12px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: right; background: var(--raised); border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); }
  table.t tr:last-child td { border-bottom: 0; } table.t tr:hover td { background: var(--hover); }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t td .nm { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .ins { display: grid; gap: 8px; }
  .insi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .insi .ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); color: var(--violet); }
  .insi .ic svg { width: 16px; height: 16px; } .insi b { display: block; font-weight: 600; } .insi span { color: var(--muted); font-size: 12.5px; }
  .tip { position: absolute; z-index: 10; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 18px 50px rgb(0 0 0 / 45%); font-size: 12px; pointer-events: none; white-space: nowrap; }
  .tip b { display: block; margin-bottom: 2px; font-weight: 600; } .tip span { color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; color: var(--muted); background: none; border: 1px solid var(--line-strong); border-radius: 999px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; } .chip.on { color: var(--ink); background: var(--raised); } .chip.off { opacity: .45; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } .kpi:nth-child(2) { border-right: 0; } .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
  @media (max-width: 760px) { .wrap { padding: 16px 16px 96px; } .table-wrap { overflow-x: auto; } }
  /* combined performance block */
  .kgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kgrid .kc { border-right: 1px solid var(--line); } .kgrid .kc:last-child { border-right: 0; }
  .kgrid.tabs .kc { cursor: pointer; } .kgrid.tabs .kc:hover { background: var(--hover); }
  .kc { position: relative; display: grid; gap: 4px; align-content: start; padding: 14px 16px; min-width: 0; }
  .kc small { color: var(--muted); font-size: 13px; } .kc > strong { font-size: 24px; font-weight: 600; line-height: 1.25; } .kc .avg { margin-top: 2px; color: var(--muted); font-size: 12.5px; } .kc .avg b { color: var(--ink); font-weight: 600; }
  .kc.on { background: color-mix(in srgb, var(--raised) 70%, transparent); } .kc.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
  .g4c { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ptabs, .vtab { display: flex; gap: 0; padding: 0 8px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .ptabs button, .vtab button { position: relative; display: inline-flex; flex: none; align-items: center; gap: 8px; height: 46px; padding: 0 12px; color: var(--muted); background: none; border: 0; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .ptabs button.on, .vtab button.on { color: var(--ink); font-weight: 500; } .ptabs button.on::after, .vtab button.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: var(--primary); }
  .ptabs .logo { width: 20px; height: 20px; font-size: 9px; } .subtle { color: var(--subtle); font-size: 12px; }
  @media (max-width: 1100px) { .kgrid, .g4c { grid-template-columns: 1fr 1fr; } .kgrid .kc:nth-child(2) { border-right: 0; } .kgrid .kc:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
  @media (max-width: 760px) { .kgrid, .g4c { grid-template-columns: 1fr; } .kgrid .kc { border-right: 0; border-bottom: 1px solid var(--line); } }

  /* ---------- platform tabs ---------- */
  .opt .card { overflow: visible; }
  .vt { display: flex; align-items: center; gap: 0; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
  .vt.boxed { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .vt.lined { border-bottom: 1px solid var(--line); }
  .vt button { position: relative; display: inline-flex; flex: none; align-items: center; gap: 8px; height: 46px; padding: 0 12px; color: var(--muted); background: none; border: 0; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .vt button:hover { color: var(--ink); }
  .vt button.on { color: var(--ink); } .vt button.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: var(--primary); }
  .vt .logo { width: 20px; height: 20px; font-size: 9px; }
  .vt .all { display: grid; place-items: center; width: 20px; height: 20px; color: var(--muted); } .vt .all svg { width: 16px; height: 16px; }
  .vt .c { display: inline-grid; box-sizing: border-box; min-width: 22px; height: 22px; place-items: center; padding: 0 6px; color: var(--ink); background: var(--soft); border: 1px solid var(--line-strong); border-radius: 6px; font-size: 11.5px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; text-box: trim-both cap alphabetic; }
  .vt .sep { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--line-strong); }
  .vt .end { margin-left: auto; padding-left: 12px; flex: none; }
  /* channel cards as tabs */
  .pcards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .pc { position: relative; display: grid; gap: 6px; padding: 12px 14px; color: var(--ink); text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font: inherit; cursor: pointer; min-width: 0; }
  .pc:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--raised) 60%, var(--surface)); }
  .pc.on { border-color: color-mix(in srgb, var(--primary) 70%, transparent); background: color-mix(in srgb, var(--primary-soft) 55%, var(--surface)); }
  .pc .top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; min-width: 0; } .pc .top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc strong { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .pc .meta { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--subtle); }
  .pc .bar { height: 4px; }
  /* channel list as selector */
  .crow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; color: var(--ink); text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .crow:hover { background: var(--hover); } .crow.on { background: var(--raised); border-color: var(--line-strong); }
  .crow .t { display: grid; gap: 4px; min-width: 0; } .crow .t > span { display: flex; justify-content: space-between; gap: 8px; } .crow .t small { color: var(--subtle); font-size: 12px; }
  .crow.dim { opacity: .5; }
  .focus { display: grid; gap: 10px; padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .focus .fr { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); } .focus .fr b { color: var(--ink); font-weight: 600; }
  /* clickable stacked share bar */
  .sbar { display: flex; height: 34px; gap: 3px; }
  .sbar button { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 10px; color: #fff; border: 0; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; overflow: hidden; white-space: nowrap; opacity: .82; }
  .sbar button:hover { opacity: 1; } .sbar.has-on button { opacity: .35; } .sbar.has-on button.on { opacity: 1; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary); }
  .sbar button span { overflow: hidden; text-overflow: ellipsis; }
  .kgrid.tabs .kc { cursor: pointer; }
  .ftag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 4px; color: var(--ink); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; font-weight: 500; }
  .ftag .logo { width: 16px; height: 16px; font-size: 8px; border-radius: 4px; }
  .ftag button { display: grid; place-items: center; width: 16px; height: 16px; padding: 0; color: var(--muted); background: none; border: 0; cursor: pointer; } .ftag button svg { width: 12px; height: 12px; }
  @media (max-width: 1100px) { .pcards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .pcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sbar button span { display: none; } }
</style>

<body>
<div class="wrap" id="root"></div>
<script>
/* ---------- data ---------- */
const P = [['Trendyol', '#f27a1a', 'T'], ['Hepsiburada', '#ff6000', 'H'], ['Shopify', '#5e8e3e', 'S'], ['N11', '#7c5cff', 'n'], ['Pazarama', '#2f9bd8', 'P']]
const SHARE = [58, 21, 11, 7, 3], REV = ['₺348.500', '₺126.180', '₺66.090', '₺42.060', '₺18.028'], ORD = [629, 228, 119, 76, 32], AOV = ['₺554', '₺553', '₺555', '₺553', '₺563'], DLT = [14.2, 9.8, 21.4, -3.1, 6.0]
const N = 30
const D = Array.from({ length: N }, (_, i) => new Date(2026, 8, 18 + i))
const cur = Array.from({ length: N }, (_, i) => Math.round(14000 + 6000 * Math.sin(i / 3.2) + 4200 * Math.sin(i / 1.3 + 1) + i * 260 + (i % 7 === 5 ? 6500 : 0)))
const prev = Array.from({ length: N }, (_, i) => Math.round(12500 + 5000 * Math.sin(i / 2.7 + 2) + 3000 * Math.cos(i / 1.6) + i * 140))
const byP = cur.map((v, i) => SHARE.map((s, j) => Math.max(0, v * s / 100 * (1 + .25 * Math.sin(i / (2 + j) + j)))))
const tl = n => '₺' + Math.round(n).toLocaleString('tr-TR')
const sum = a => a.reduce((x, y) => x + y, 0)
const ds = d => d.getDate() === 1 ? `1 ${['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'][d.getMonth()]}` : `${d.getDate()}`
const ico = p => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`
const I = { chev: ico('<path d="m4.5 6 3.5 3.5L11.5 6"/>'), up: ico('<path d="M4 10l4-4 4 4"/>'), down: ico('<path d="M4 6l4 4 4-4"/>'), arrow: ico('<path d="M3 8h10M9 4l4 4-4 4"/>'), star: ico('<path d="M8 2.2 9.7 5.7l3.8.5-2.8 2.7.7 3.8L8 10.9l-3.4 1.8.7-3.8-2.8-2.7 3.8-.5z"/>'), dip: ico('<path d="M3 5l4 4 2.5-2.5L13 10M10 10h3V7"/>'), cal: ico('<rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/>'), cart: ico('<path d="M1.5 2.5h2l1.6 7.4a1 1 0 0 0 1 .8h5.6a1 1 0 0 0 1-.8L14.5 5.5H4.4"/>'), bolt: ico('<path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/>'), dl: ico('<path d="M8 2.5v8M4.8 7.5 8 10.7l3.2-3.2"/><path d="M2.5 10.5v3h11v-3"/>') }
const logo = j => `<span class="logo" style="background:${P[j][1]}">${P[j][2]}</span>`
const sel = l => `<button class="sel">${l}${I.chev}</button>`
const trend = (t, up = true) => `<span class="trend ${up ? 'up' : 'down'}">${up ? I.up : I.down}${t}<em>önceki döneme göre</em></span>`
const totalBlock = (l = 'Son 30 Gün', v = tl(sum(cur)), t = '%12,3') => `<div class="total"><small>${l}</small><strong class="num">${v}</strong>${trend(t)}</div>`
const head = (t, d, right = '') => `<div class="ch"><div><h3>${t}</h3><p>${d}</p></div>${right}</div>`

/* ---------- svg helpers ---------- */
function frame(W, H, max, { L = 56, R = 8, T = 10, B = 26, ticks = 5, money = true } = {}) {
  const x = i => L + i / (N - 1) * (W - L - R), y = v => T + (1 - v / max) * (H - T - B)
  const grid = Array.from({ length: ticks + 1 }, (_, i) => { const v = max / ticks * i; return `<line class="g" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${money ? (v ? '₺' + Math.round(v / 1000) + ' B' : '₺0') : Math.round(v)}</text>` }).join('')
  const xs = D.map((d, i) => i % 5 === 0 || d.getDate() === 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${ds(d)}</text>` : '').join('')
  return { x, y, grid: grid + xs, W, H, L, R, T, B }
}
const path = (arr, f) => arr.map((v, i) => `${i ? 'L' : 'M'}${f.x(i).toFixed(1)} ${f.y(v).toFixed(1)}`).join(' ')
const smooth = (arr, f) => { let d = `M${f.x(0)} ${f.y(arr[0])}`; for (let i = 1; i < arr.length; i++) { const x0 = f.x(i - 1), x1 = f.x(i), y0 = f.y(arr[i - 1]), y1 = f.y(arr[i]), cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}` } return d }
const maxOf = (...a) => Math.ceil(Math.max(...a.flat()) / 10000) * 10000
let gid = 0
function areaChart({ W = 760, H = 260, series = cur, prevSeries = prev, markers = false, target = null, smoothLine = false, color = 'var(--violet)' } = {}) {
  const f = frame(W, H, maxOf(series, prevSeries || [0], target ? [target] : [0])), id = 'ag' + (++gid)
  const ln = smoothLine ? smooth(series, f) : path(series, f)
  const mk = markers ? (() => { const hi = series.indexOf(Math.max(...series)), lo = series.indexOf(Math.min(...series)); return `<circle cx="${f.x(hi)}" cy="${f.y(series[hi])}" r="4.5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2"/><text x="${f.x(hi)}" y="${f.y(series[hi]) - 10}" text-anchor="middle" style="fill:var(--ok);font-weight:600">En yüksek ${tl(series[hi])}</text><circle cx="${f.x(lo)}" cy="${f.y(series[lo])}" r="4.5" fill="var(--surface)" stroke="var(--bad)" stroke-width="2"/><text x="${f.x(lo)}" y="${f.y(series[lo]) + 20}" text-anchor="middle" style="fill:var(--bad);font-weight:600">En düşük ${tl(series[lo])}</text>` })() : ''
  const tg = target ? `<line x1="${f.L}" x2="${W - f.R}" y1="${f.y(target)}" y2="${f.y(target)}" stroke="var(--warn)" stroke-dasharray="6 4"/><text x="${W - f.R}" y="${f.y(target) - 6}" text-anchor="end" style="fill:var(--warn)">Günlük hedef ${tl(target)}</text>` : ''

// chart with its own scale so orders, basket and product counts read right too
function niceMax(v) { const m = 10 ** Math.floor(Math.log10(Math.max(1, v) / 5)); return Math.ceil(v / 5 / m) * m * 5 }

  const ln = a => a.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ')
  const id = 'pg' + (++gid)

}

  ['C', 'Sekme Kartı · Solda Metrik Sütunu', 'Öneri 2 görünüşü: üstte ayrı bir sekme kartı (sipariş sayfasındaki sekme kartıyla aynı), altında üç sütun: solda metrik kartları, ortada grafik, sağda halka ve kanallar. Seçilen platform halkada öne çıkar, diğer dilimler söner.',
    k => { const s = st(k); const ms = metricsFor(s.p); const d = donut(150, 104, s.p < 0 ? 'Sipariş' : pName(s.p), s.p < 0 ? '1.084' : String(ORD[s.p])); const dn = s.p < 0 ? d : d.replace(/conic-gradient\(([^)]*)\)/, (m0, stops) => 'conic-gradient(' + stops.split(', ').map((x, j) => j === s.p ? x : x.replace(/#[0-9a-f]{6}/, c => c + '40')).join(', ') + ')'); return vtabs(k, s, 'boxed', '<span class="subtle">Son 30 Gün</span>') + '<div style="display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px;margin-top:12px" class="c3"><div style="display:grid;gap:10px">' + ms.map((m, i) => '<article class="card" data-k="' + k + '" data-m="' + i + '" style="cursor:pointer;' + (i === s.m ? 'border-color:color-mix(in srgb,var(--primary) 70%,transparent)' : '') + '">' + kpiCell(m, { rangeBar: false, sp: true, compact: true }) + '</article>').join('') + '</div><article class="card">' + head(mLabel(s), 'Son 30 gün', '<div class="tools">' + sel('Son 30 Gün') + '</div>') + '<div class="cb">' + totalBlock('Son 30 Gün · ' + pName(s.p), ms[0].v, ms[0].t) + metricChart(s, 280) + legendCur + '</div></article><article class="card">' + head('Satış Kanalları', 'Ciro payı', ftag(k, s)) + '<div class="cb" style="justify-items:center">' + dn + '<div style="width:100%">' + chanSel(k, s) + '</div></div></article></div>' }],
  ['D', 'Kanal Listesi Sekme · Solda Metrik Sütunu', 'Öneri 2 görünüşü, ayrı sekme yok: sağdaki kanal listesi aynı zamanda seçici. Bir kanala tıklayınca soldaki metrikler ve ortadaki grafik o kanala geçer; tekrar tıklayınca hepsine döner. Ekranda tek seçim yeri, sıfır tekrar.',
    k => { const s = st(k); const ms = metricsFor(s.p); return '<div style="display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px" class="c3"><div style="display:grid;gap:10px">' + ms.map((m, i) => '<article class="card" data-k="' + k + '" data-m="' + i + '" style="cursor:pointer;' + (i === s.m ? 'border-color:color-mix(in srgb,var(--primary) 70%,transparent)' : '') + '">' + kpiCell(m, { rangeBar: false, sp: true, compact: true }) + '</article>').join('') + '</div><article class="card">' + head(mLabel(s), 'Son 30 gün', '<div class="tools">' + ftag(k, s) + sel('Son 30 Gün') + '</div>') + '<div class="cb">' + totalBlock('Son 30 Gün · ' + pName(s.p), ms[0].v, ms[0].t) + metricChart(s, 280) + legendCur + '</div></article><article class="card">' + head('Satış Kanalları', 'Süzmek için kanala tıklayın') + '<div class="cb" style="gap:8px"><button class="crow ' + (s.p < 0 ? 'on' : '') + '" data-k="' + k + '" data-p="-1"><span class="all" style="display:grid;place-items:center;width:22px;height:22px;color:var(--muted)">' + allI + '</span><span class="t"><span><b style="font-weight:500">Tüm Platformlar</b><small class="num">' + tl(sum(cur)) + '</small></span>' + stack100(6) + '</span><span class="pct num">%100</span></button>' + chanSel(k, s) + focus(s) + '</div></article></div>' }],
  ['E', 'Tek Kart · Sekmeler Başlıkta', 'Öneri 3 görünüşü: tek kart; platform sekmeleri kartın başlık satırı, dönem seçimi sekmelerin sağında. Altında metrik şeridi, grafik ve en altta kanal payı şeridi. Seçilen platformun rengi grafiğe ve şeride geçer.',
    k => { const s = st(k); return '<article class="card">' + vtabs(k, s, 'lined', periodSeg) + kpis(k, s, {}) + '<div class="cb" style="padding-top:16px">' + metricChart({ p: s.p, m: 0 }, 240) + '<div style="display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:13px"><b style="font-weight:600">Satış Kanalları</b><a class="link" href="#">Kanalları Yönet ' + I.arrow + '</a></div>' + sbar(k, s) + '<div class="legend">' + SHARE.map((x, j) => '<span style="' + (s.p >= 0 && s.p !== j ? 'opacity:.45' : '') + '"><i style="background:' + P[j][1] + '"></i>' + P[j][0] + ' %' + x + ' · ' + REV[j] + '</span>').join('') + '</div></div></div></article>' }],
  ['F', 'Tek Kart · Pay Şeridi Sekme', 'Öneri 3 görünüşü, sekme yerine pay şeridi: kartın başındaki renkli kanal şeridi tıklanabilir; dilime basınca o platform seçilir, metrik şeridi, grafik ve özet ona göre yenilenir. Hem pay hem seçim tek göstergede.',
    k => { const s = st(k); return '<article class="card"><div class="ch" style="padding-bottom:12px"><div><h3>Performans · ' + pName(s.p) + '</h3><p>Son 30 gün · süzmek için şeritte bir kanala tıklayın</p></div><div class="tools">' + ftag(k, s) + periodSeg + '</div></div><div style="padding:0 16px 14px">' + sbar(k, s) + '</div>' + kpis(k, s, {}) + '<div class="cb split" style="padding-top:16px;align-items:start"><div>' + metricChart({ p: s.p, m: 0 }, 240) + legendCur + '</div><div style="display:grid;gap:12px;padding-left:16px;border-left:1px solid var(--line)">' + (s.p < 0 ? '<b style="font-size:13px">Kanallar</b>' + chanSel(k, s) : focus(s) + '<b style="font-size:13px">Diğer Kanallar</b>' + chanSel(k, s)) + '</div></div></article>' }],
]
function render() {
  gid = 0
  document.getElementById('root').innerHTML = '<header class="head"><div class="crumb">Genel Bakış</div><h1>Platform Sekmeleri · 6 Öneri</h1><p>Öneri 5\'in mantığı (seçilen platform metrikleri, grafiği ve kanal payını birlikte süzer) Öneri 1-3\'ün görünüşleriyle. Sekmelere, kartlara veya kanallara tıklayın; değerler gerçekten değişir. Veriler örnektir.</p></header>' + OPTS.map(([k, t, d, fn]) => '<section class="opt"><header><h2>Öneri ' + k + ' · ' + t + '</h2><p>' + d + '</p></header>' + fn(k) + '</section>').join('') + '<style>@media (max-width:1100px){.c3{grid-template-columns:1fr!important}}</style>'
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-k]'); if (!t) return
  e.preventDefault()
  const s = st(t.dataset.k)
  if (t.dataset.p != null) s.p = +t.dataset.p
  if (t.dataset.m != null) s.m = +t.dataset.m
  render()
})
render()
</script>
</body>
</html>
