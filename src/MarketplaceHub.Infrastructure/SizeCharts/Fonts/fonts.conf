<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Size chart rasterizing (SizeChartRasterizer): only the Montserrat files beside this file, so a chart drawn by the
     owner's skill looks the same on every host whatever fonts it has. The files are the skill's own Montserrat
     (SIL Open Font License, https://openfontlicense.org), converted from WOFF2 to TrueType. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Montserrat</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Montserrat</family></prefer>
  </alias>
</fontconfig>
