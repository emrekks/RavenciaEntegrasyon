name: Verify source changes

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source with comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify clean source tree
        run: python3 scripts/verify-repository-cleanliness.py

      - name: Verify documentation transaction
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BASE:-}}"
          [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]] || base="$(git rev-parse HEAD^)"
          python3 scripts/verify-documentation-transaction.py --base "$base"

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install exact Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Pin and verify npm
        run: |
          set -euo pipefail
          npm install --global npm@11.12.1
          [[ "$(node --version)" == "v24.18.1" ]]
          [[ "$(npm --version)" == "11.12.1" ]]

      - name: Install locked web dependencies
        working-directory: src/MarketplaceHub.Web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify .NET solution
        run: |
          set -euo pipefail
          dotnet restore MarketplaceHub.sln --locked-mode
          dotnet build MarketplaceHub.sln --no-restore
          dotnet test MarketplaceHub.sln --no-build --no-restore
          dotnet format MarketplaceHub.sln --verify-no-changes --no-restore

      - name: Verify web application
        working-directory: src/MarketplaceHub.Web
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e
