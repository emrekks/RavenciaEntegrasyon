name: Image Scan

# Security plan U4, weekly half: the digests in the Dockerfiles stay fixed between deploys, but new CVEs are
# published against them. Every Monday the images main would deploy are built (the server builds the same
# Dockerfiles) and scanned for CRITICAL vulnerabilities that already have a fix. A finding fails this run
# (red in Actions, e-mailed to the repository owner by GitHub) and opens one issue, or comments on the open
# one, with the findings. Validate does the same scan on every change to the images.
on:
  schedule:
    - cron: "0 4 * * 1" # Monday 07:00 Istanbul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: Dockerfile
          - image: edge
            dockerfile: deploy/caddy/Dockerfile.production
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Build ${{ matrix.image }} image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: marketplacehub-${{ matrix.image }}:weekly-scan
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" .

      - name: Scan ${{ matrix.image }} image (CRITICAL, fixable)
        id: scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: marketplacehub-${{ matrix.image }}:weekly-scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.image }}.txt

      - name: Show findings
        if: always()
        env:
          REPORT: trivy-${{ matrix.image }}.txt
        run: |
          if [[ -s "$REPORT" ]]; then
            cat "$REPORT"
            { echo '```'; head -c 60000 "$REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the findings issue
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          REPORT: trivy-${{ matrix.image }}.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          title="Image scan: fixable CRITICAL vulnerabilities in the $IMAGE image"
          {
            echo "The weekly scan of main's $IMAGE image found CRITICAL vulnerabilities with a released fix: $RUN_URL"
            echo
            echo "Fix: bump the base image digest (Dockerfile, deploy/caddy/Dockerfile*) or the package, then ship."
            echo
            echo '```'
            head -c 50000 "$REPORT" 2>/dev/null || echo "(no report file)"
            echo '```'
          } > issue-body.md
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          fi
