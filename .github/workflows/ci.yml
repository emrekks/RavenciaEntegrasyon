name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: marketplacehub_test
          POSTGRES_USER: marketplacehub
          POSTGRES_PASSWORD: development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplacehub -d marketplacehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: src/MarketplaceHub.Web/package-lock.json

      - name: Restore backend
        run: dotnet restore MarketplaceHub.sln --locked-mode

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Validate deployment shell scripts
        run: |
          bash -n deploy/backup/*.sh deploy/scripts/*.sh
          shellcheck deploy/backup/*.sh deploy/scripts/*.sh

      - name: Verify .NET format
        run: dotnet format MarketplaceHub.sln --verify-no-changes --no-restore

      - name: Build backend
        run: dotnet build MarketplaceHub.sln --no-restore --configuration Release

      - name: Test backend
        env:
          MARKETPLACEHUB_TEST_CONNECTION: "Host=localhost;Port=5432;Database=marketplacehub_test;Username=marketplacehub;Password=development-only"
        run: dotnet test MarketplaceHub.sln --no-build --configuration Release

      - name: Verify EF model has no pending migration
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/MarketplaceHub.Infrastructure/MarketplaceHub.Infrastructure.csproj --startup-project src/MarketplaceHub.Api/MarketplaceHub.Api.csproj --no-build --configuration Release

      - name: Install frontend dependencies
        working-directory: src/MarketplaceHub.Web
        run: npm ci --ignore-scripts

      - name: Typecheck frontend
        working-directory: src/MarketplaceHub.Web
        run: npm run typecheck

      - name: Test frontend HTML sanitization
        working-directory: src/MarketplaceHub.Web
        run: npm run test:security

      - name: Build frontend
        working-directory: src/MarketplaceHub.Web
        run: npm run build

      - name: Check frontend bundle budget
        working-directory: src/MarketplaceHub.Web
        run: npm run check:bundle

      - name: Audit npm dependencies
        working-directory: src/MarketplaceHub.Web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit NuGet dependencies
        run: dotnet list MarketplaceHub.sln package --vulnerable --include-transitive
