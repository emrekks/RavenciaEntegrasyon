name: Publish immutable release images

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-release-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify approved main commit and source gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-repository-cleanliness.py
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          workflow_runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${workflow_runs_url}" > workflow-runs.json
          jq -e --arg sha "${GITHUB_SHA}" 'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' workflow-runs.json > /dev/null
          echo "Approved main verification found for ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Create exact Buildx builder
        shell: bash
        run: |
          set -euo pipefail
          buildx_version='v0.34.1'
          buildx_sha256='f1332ddb9010bd0b72628266c3a906d9a6979848033df4c8d9bd2cd113bae12b'
          plugin_dir="${HOME}/.docker/cli-plugins"
          plugin_path="${plugin_dir}/docker-buildx"
          mkdir -p "${plugin_dir}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/docker/buildx/releases/download/${buildx_version}/buildx-${buildx_version}.linux-amd64" \
            --output "${plugin_path}"
          printf '%s  %s\n' "${buildx_sha256}" "${plugin_path}" | sha256sum --check --status
          chmod 0755 "${plugin_path}"
          [[ "$(docker buildx version)" == *"${buildx_version}"* ]]
          docker buildx create --name marketplacehub-release --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Authenticate to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish application image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/marketplacehub-app"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --metadata-file app-metadata.json \
            --push .

      - name: Build and publish production edge image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/marketplacehub-edge"
          docker buildx build \
            --file deploy/caddy/Dockerfile.production \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --metadata-file edge-metadata.json \
            --push .

      - name: Verify digests and write release record
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app_digest="$(jq -r '."containerimage.digest"' app-metadata.json)"
          edge_digest="$(jq -r '."containerimage.digest"' edge-metadata.json)"
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "${app_digest}" =~ ${digest_pattern} ]]
          [[ "${edge_digest}" =~ ${digest_pattern} ]]
          {
            echo '## Immutable release images'
            echo
            echo "- Git commit: \`${GITHUB_SHA}\`"
            echo "- MARKETPLACEHUB_APP_IMAGE=ghcr.io/${owner}/marketplacehub-app@${app_digest}"
            echo "- MARKETPLACEHUB_EDGE_IMAGE=ghcr.io/${owner}/marketplacehub-edge@${edge_digest}"
            echo
            echo 'Copy these exact `name@sha256:...` values into the approved deployment record. Do not deploy the mutable `sha-*` tags.'
          } >> "${GITHUB_STEP_SUMMARY}"
